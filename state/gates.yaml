# Evidence-gate board.
#
# The gate definitions come from PROJECT_PLAN.md section 11; `status` and `evidence`
# record where each one actually stands, and are the operator's judgement rather than
# anything the code can infer. Update this file together with state/CURRENT.md when a
# gate's status changes, and keep the two consistent. The weblog renders it verbatim.
#
# status: complete | open | blocked | not-started
schema_version: 1
updated: 2026-09-21
# One-line state of the research, shown as the weblog's headline. Keep it in sync with
# the Current hypothesis section of state/CURRENT.md; the weblog falls back to that
# section's newest paragraph if this is absent.
headline: >-
  Gate I is answered. A causal model over the same codec, matched to the denoiser at
  524,674 parameters against 525,152 on the same hashed corpus and the same 100,800 icon
  presentations, clears a zero-parameter position-marginal floor by 7.7% against a
  predeclared 50% - and the renders say exactly what that number means. The samples are
  scribbles: valid programs in corpus palette colours with plausible ink coverage and not
  one recognisable shape. Five arms measured every factor available and the gap barely
  moved. The coordinate fix that was decisive for the denoiser does nothing; four times
  the data buys 0.0055 of ratio; nine times the capacity is monotonically worse; dropout
  is the best of them at 0.0142 and an order of magnitude short. The codec supports
  generation - every sample is valid and renderable - and does not support learning it
  left to right at any scale this project can reach.

gates:
  - id: Gate A
    title: Orchestration and recovery
    status: complete
    question: Would a worker loss erase the experiment ledger, or hide an active job?
    evidence: >-
      Run registry, durable artifact sink, and detached launch/status/sync adapters are
      in place and exercised. The owned-worker adapter smoke round-tripped a hashed
      artifact twice, and three preceding adapter failures are preserved with reason
      codes.
  - id: Gate B
    title: Corpus and rights audit
    status: complete
    question: Is every sample, split, and exclusion traceable, hashed, and justified?
    evidence: >-
      The reviewed OpenMoji 17.0.0 primary manifest has 4,006 rows: 3,902 ordinary
      includes and 104 visually reviewed overrides. It excludes 270 metadata flags,
      keeps 218 noncanonical aliases in a reversible split, and retains one
      renderer-failing SVG as a defect row. Independent verification passes.
  - id: Gate C
    title: Representation study
    status: complete
    question: Which typed SVG representation, with what explicit tradeoffs and fallback?
    evidence: >-
      Semantic strokes with a 60-case reason-coded outlined fallback, role-typed q289
      endpoints and q417 control handles, K48+1 stroke widths, and packed P80/T1216
      capacity. Selected against measured alternatives; the falsified viewBox-clamping
      and unaugmented-K48 tails are kept as negative results.
  - id: Gate D
    title: Invariant and renderer stress test
    status: complete
    question: Do exposed states serialize safely and render reliably, with failures classified?
    evidence: >-
      200 stable random packed round trips, 2,000/2,000 invalid mutations rejected
      across ten families, three malformed typed-XML cases classified, and 25 isolated
      renders including an 80-path/1,216-segment boundary program. The first
      mutator-boundary failure is preserved.
  - id: Gate E
    title: Tiny learning proof
    status: complete
    question: Is the representation learnable end to end, with exact checkpoint resume?
    evidence: >-
      Closed from a controlled v1-v5 sequence: 100% one-icon overfit, one-icon and
      diverse held-out recovery, recognizable renders at 72 and 18 px, and exact resume
      with byte-stable artifacts. Fixed-topology geometry only.
  - id: Gate F
    title: Corruption comparison
    status: complete
    question: Which corruption process is the primary, on measured grounds?
    evidence: >-
      Factorized role-uniform corruption is the primary. Across two seeds it beats
      path-correlated corruption on changed-token recovery by 12.07 and 12.60 points on
      a matched v3 fixture. Whole-path replacement reaches 100% but changes far fewer
      held-out fields, so it is retained as a lighter feasibility ablation.
  - id: Gate G
    title: OpenMoji generation and editing
    status: open
    question: >-
      Does the selected formulation actually generate and edit OpenMoji well, under
      structured conditioning and locked-path inpainting?
    evidence: >-
      Reopened. A five-lens diagnostic panel found four verified defects that had been
      present throughout: the loss averaged over per-(kind, slot) groups so four fields
      carried 31% of it and early stopping fired on noise; no attention padding mask, so
      29.4% of the sequence was attended as content; corruption drew replacements
      uniformly, so a zero-parameter marginal detector scored 2.84 and detection was
      largely a density test; and coordinates were encoded as unordered categories, so
      the difference the winning heuristic computes had no operand. Fixing all four
      produced the project's first trained model to beat a zero-parameter heuristic on a
      leak-free task - detector lift 2.781 against 1.893, with 54,720 FEWER parameters.
      Turning the value head back on loses it again: it costs 1.064 of detector lift and
      aggregate accuracy stays at 0.5839 against the identity policy's 0.6515. Detection
      is solved. Balancing the two objectives by their chance entropies then let both
      survive - detector 2.569, changed-token recovery 0.0738 - and with a decode
      threshold calibrated on a disjoint half of the held-out icons the model reaches
      0.6567 against the identity policy's 0.6502. That is the first time anything in
      this project has beaten emitting its input unchanged. The calibration asterisk was
      then removed: the threshold is derivable as 1/(1+q) in the value head's accuracy,
      and estimating q on 256 icons withheld from training gives 0.6543 against 0.6515
      with nothing fitted on held-out data at all. The margin is +0.0027, about 0.4%
      relative - not a good model, but one that has stopped being worse than useless.
      Two further corrections then compounded: a distance-kernel value target, which cut
      mean absolute view-unit error 27%, and a decode gate chosen by error saved rather
      than by exact tokens. Paired per-icon render recovery went 0.0447 to 0.1246 to
      0.2511 at 72 px, helping 11 of 12 icons with the interval excluding zero, while
      exact-token accuracy fell below identity - which settles that exact-token accuracy
      is the wrong primary metric here. The four earlier eliminations were then retested
      off that base and all survive - capacity restores v3, 256 icons restores v2, noise
      conditioning restores v4 - so they are admissible again. Sweeping that model across
      corruption levels then produced the gate's first recognizable output: at
      probability 0.05 and 0.10 the predictions are recognizable icons and visibly
      repaired, with recovery +0.0308 and +0.3902 against the earlier checkpoint's
      -4.6517 and -1.2024. The ceiling was the corruption schedule, not the
      representation, the model or the objective. Training across corruption levels was
      then tested and is not the lever either - indistinguishable at low levels and
      measurably worse at 0.35 - so every training-side factor this gate identified is
      settled. At 32 icons both models improve lightly corrupted inputs significantly,
      26 and 29 of 32 at p=0.05. It remains a denoiser that removes stray strokes from a
      mostly intact icon, not a generator, and generation is Gate I's question. Every earlier plateau in
      this gate was measured under the broken loss and is no longer admissible as read.

  - id: Gate H
    title: Broad pretraining question
    status: not-started
    question: Does broader licensed pretraining help, or dilute the style?
    evidence: Gated on a stable OpenMoji pipeline.
  - id: Gate I
    title: Cached AR comparison
    status: complete
    question: >-
      How does the denoiser compare with a matched, KV-cached autoregressive baseline -
      and does the representation support generation at all?
    evidence: >-
      Answered, negatively and thoroughly. The causal model is built and learns: it
      memorises four icons exactly through the KV cache and the dynamic legal-token
      masks. At corpus scale, matched on every term the plan names, it reaches 3.6249
      nats per free token against a zero-parameter position-marginal floor of 3.9290 - a
      ratio of 0.923 where the criterion was 0.500 - and from step 1200 it is worse than
      the floor while its training loss keeps falling. Five arms then measured every
      factor available: the coordinate encoding that was decisive for the denoiser on
      this same codec does nothing, 4x the data buys 0.0055 of ratio, 9x the capacity is
      monotonically worse, and dropout is the largest effect at 0.0142 and still an order
      of magnitude short. The renders settle it - eight subgroups, three samples each,
      beside real icons: valid programs in corpus palette colours, median 8.5 active
      paths, ink coverage 0.388 against 0.253, and no recognisable shape anywhere. The
      numbers and the pictures agree. On gpubox-4080: 301 s to train, 3.63 GiB peak, and
      the KV cache is worth 16% rather than an order of magnitude because at this size
      the decode is bound by kernel launches rather than arithmetic - a measurement that
      contradicts the asymptotic argument. The quality half of the plan's comparison is
      not well-posed between these two models and that is recorded as the result rather
      than papered over: no metric applies to both without putting one out of
      distribution. The branch this recommends is an any-order masked model, which would
      share this codec and harness and could be scored against the denoiser on one task
      with one metric.

  - id: Gate J
    title: Deployment optimization
    status: not-started
    question: Do the optimizations preserve numerical and visual parity, and pay off?
    evidence: Gated on a frozen checkpoint worth optimizing.
  - id: Gate K
    title: Research interface and narrative
    status: open
    question: Does every displayed claim link to a reproducible run and environment?
    evidence: >-
      This weblog is the first piece: a static view over the committed run registry,
      run records, findings, and renders, served on the machine's Tailscale address.
      The paired trajectory viewer, inpainting controls, and benchmark explorer are not
      built yet.
