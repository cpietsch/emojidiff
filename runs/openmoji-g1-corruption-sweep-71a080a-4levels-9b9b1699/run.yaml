  checkpoint_step: 840
  trained_corruption_probability: 0.35
  hybrid_sha256: 9b9b1699677a6f97f1e2ecedc574199411bf850d257e4526525c851edc4ea38b
execution:
  icons_per_level: 32
  levels: [0.05, 0.10, 0.20, 0.35]
  render_sizes: [72, 18]
  network: none
predeclared_criteria:
  note: >-
    Declared before launch. The 12-icon probe at 0.35 measured a median recovery of
    about 16% of the render gap; the per-icon mean recovery fraction at 0.35 is not yet
    known and is measured here as the control.
  primary:
    - id: recovery_improves_at_lower_corruption
      statement: >-
        At 72 px, the mean per-icon recovery fraction at probability 0.10 is at least
        twice the mean recovery fraction at the control probability 0.35.
    - id: monotone_in_corruption
      statement: >-
        At 72 px, the mean recovery fraction is non-increasing across the levels in the
        order 0.05, 0.10, 0.20, 0.35.
    - id: a_useful_regime_exists
      statement: >-
        At some level the mean recovery fraction exceeds 0.50, meaning the model closes
        more than half the render gap between the corrupted input and the clean program.
    - id: reproducibility
      statement: Every level reproduces identical artifacts on a second invocation.
  falsification_meaning: >-
    A negative or near-zero recovery fraction at low corruption supports the damage
    hypothesis: the binding problem is that the model overwrites correct fields, which
    the standing 0.90 retained-preservation bar has been measuring all along at 0.41.
    In that case the next experiment is not a corruption schedule but an objective or
    architecture that can leave correct fields alone - for example predicting an edit
    mask, or conditioning on which fields were corrupted. That redirection would be the
    most valuable outcome available here and must not be tuned away.
  reported_not_gated:
    - absolute median RGBA MAE for `x_t` and `x_hat_0` at every level
    - the 18 px figures as a consistency check
    - whether any level produces visually recognizable output
outputs:
  local_metadata: runs/openmoji-g1-corruption-sweep-71a080a-4levels-9b9b1699
  report_roots: reports/learning/openmoji-g1-corruption-sweep-p{005,010,020,035}
planned_at: 2026-09-20T19:00:00Z
completed_at: 2026-09-20T19:15:00Z
result:
  statistic: per-icon recovery fraction (MAE(x_t) - MAE(x_hat_0)) / MAE(x_t), 72 px
  levels:
    "0.05": {median_x_t: 0.04973, median_x_hat_0: 0.13853, mean_recovery: -4.6517, ci95: [-7.6718, -1.6316], helped: 0, of: 32}
    "0.10": {median_x_t: 0.08116, median_x_hat_0: 0.13914, mean_recovery: -1.2024, ci95: [-2.1178, -0.2869], helped: 4, of: 32}
    "0.20": {median_x_t: 0.13864, median_x_hat_0: 0.13717, mean_recovery: -0.1315, ci95: [-0.2845, 0.0216], helped: 14, of: 32}
    "0.35": {median_x_t: 0.17606, median_x_hat_0: 0.14045, mean_recovery: 0.1800, ci95: [0.1030, 0.2570], helped: 26, of: 32}
  input_independence:
    mean_x_t_error_by_level: {"0.05": 0.05098, "0.10": 0.08739, "0.20": 0.13592, "0.35": 0.17958}
    mean_x_hat_0_error_by_level: {"0.05": 0.13822, "0.10": 0.13820, "0.20": 0.14728, "0.35": 0.14651}
    per_icon_pearson_r_p005_vs_p035: 0.9122
    mean_abs_prediction_difference_p005_vs_p035: 0.01902
    statement: >-
      Input render error varies by a factor of 3.5 across the sweep while prediction
      error moves about 6%, and per-icon predictions at 0.05 and 0.35 correlate at
      r = 0.91. The model emits nearly the same reconstruction regardless of how
      corrupted its input is.
  identical_rerun: true
predeclared_outcome:
  overall: falsified
  recovery_improves_at_lower_corruption: {passed: false, observed: -1.2024, threshold: 0.3600}
  monotone_in_corruption: {passed: false, observed: [-4.6517, -1.2024, -0.1315, 0.1800], note: strictly increasing in p, the opposite of the prediction}
  a_useful_regime_exists: {passed: false, observed: 0.1800, threshold: 0.50}
  reproducibility: {passed: true}
  competing_hypothesis_confirmed: damage
  conclusion: >-
    The regime hypothesis is false and the damage hypothesis registered alongside it is
    confirmed. At probability 0.05 the model makes its input 2.8x worse and helps on
    zero of thirty-two icons. The mechanism is that the prediction barely depends on the
    input: the model has learned a group- and subgroup-conditioned prior over icon
    geometry and emits approximately that. GeometryDenoiser has no noise-level or
    timestep input and no mask marking corrupted fields, and it trained at a single
    fixed probability, so nothing tells it how much to trust what it is given.
  reinterprets_earlier_runs: >-
    The measurements stand, the interpretation does not. The +18% recovery at 0.35 is a
    fixed-quality output beating a badly corrupted baseline, not recovered geometry.
    Retained-token accuracy of 0.4128 was this same finding visible in token space since
    v1. The shared loss floor near 7.35 across a 3.53x capacity change is consistent
    with both models learning the same prior. v1 and v2 learned a prior over icons, not
    a conditional denoiser.
  redirects_to: >-
    Not a corruption schedule. Give the model a noise-level or timestep embedding and
    train across a range of levels; make copying easy through an edit mask or a residual
    against x_t; and, as a diagnostic upper bound only, condition on which fields were
    corrupted to separate identification failure from prediction failure.
artifact_durability:
  versioned: >-
    Four contact sheets, summaries, and per-icon render metrics under reports/learning/,
    with metrics and summaries also copied into this run directory. Reproducible from
    the durable v2 checkpoint on CPU in about six minutes.
