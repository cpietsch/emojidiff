schema_version: 1
run_id: openmoji-g1-corruption-sweep-71a080a-4levels-9b9b1699
state: planned
parent_run: openmoji-g1-train-v2-datascale-a50b2e0-c474c94d-9b9b1699
hypothesis: >-
  Two mechanisms are in tension and this run adjudicates between them. The regime
  hypothesis says the fixed 0.35 corruption probability destroys information no model
  can recover, so one fixed checkpoint evaluated at lower corruption should close a much
  larger fraction of the render gap between `x_t` and `x_0`. The damage hypothesis says
  the opposite: held-out retained-token accuracy is only 0.4128, meaning the model
  overwrites about 59% of the fields that were already correct, and at low corruption
  there are far more correct fields to damage, so the recovered fraction could fall to
  zero or go negative and the model could make its input measurably worse.
  The prediction registered here is the regime hypothesis, because it is the one the
  render probe motivated and the one the project's next experiment depends on.
expected_information_gain: >-
  v2 eliminated data volume and v3 eliminated model capacity, leaving the corruption
  schedule as the only standing candidate. Before spending training runs on it, this
  establishes whether the model has any regime in which it is useful at all. It needs no
  training: one fixed checkpoint, four evaluation levels, CPU only. If recovery improves
  sharply at lower corruption, a training-schedule experiment is justified. If the model
  damages its input instead, the binding problem is retained-token preservation and no
  corruption schedule will fix it.
scope_limits: >-
  One checkpoint, one seed, 32 held-out icons per level, one corruption draw per icon.
  The model trained only at 0.35, so evaluating it at 0.05 is off-distribution by
  construction; that is the point, but it means a poor result at low corruption does not
  by itself condemn a model trained there.
method: >-
  Evaluate and render the v2 loss-selected step-840 checkpoint at corruption
  probabilities 0.05, 0.10, 0.20 and 0.35, with 0.35 as the control since it is the
  trained level. Identical icons, sizes and corruption seeds at every level, so only the
  Bernoulli rate differs.
  The reported statistic is the per-icon recovery fraction,
  `(MAE(x_t) - MAE(x_hat_0)) / MAE(x_t)`, the share of the render gap the model closes.
  Absolute render error is not comparable across levels because `x_t` itself gets closer
  to `x_0` as corruption falls.
