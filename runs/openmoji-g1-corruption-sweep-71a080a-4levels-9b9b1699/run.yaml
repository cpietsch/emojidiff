  network: none
predeclared_criteria:
  note: >-
    Declared before launch. The 12-icon probe at 0.35 measured a median recovery of
    about 16% of the render gap; the per-icon mean recovery fraction at 0.35 is not yet
    known and is measured here as the control.
  primary:
    - id: recovery_improves_at_lower_corruption
      statement: >-
        At 72 px, the mean per-icon recovery fraction at probability 0.10 is at least
        twice the mean recovery fraction at the control probability 0.35.
    - id: monotone_in_corruption
      statement: >-
        At 72 px, the mean recovery fraction is non-increasing across the levels in the
        order 0.05, 0.10, 0.20, 0.35.
    - id: a_useful_regime_exists
      statement: >-
        At some level the mean recovery fraction exceeds 0.50, meaning the model closes
        more than half the render gap between the corrupted input and the clean program.
    - id: reproducibility
      statement: Every level reproduces identical artifacts on a second invocation.
  falsification_meaning: >-
    A negative or near-zero recovery fraction at low corruption supports the damage
    hypothesis: the binding problem is that the model overwrites correct fields, which
    the standing 0.90 retained-preservation bar has been measuring all along at 0.41.
    In that case the next experiment is not a corruption schedule but an objective or
    architecture that can leave correct fields alone - for example predicting an edit
    mask, or conditioning on which fields were corrupted. That redirection would be the
    most valuable outcome available here and must not be tuned away.
  reported_not_gated:
    - absolute median RGBA MAE for `x_t` and `x_hat_0` at every level
    - the 18 px figures as a consistency check
    - whether any level produces visually recognizable output
