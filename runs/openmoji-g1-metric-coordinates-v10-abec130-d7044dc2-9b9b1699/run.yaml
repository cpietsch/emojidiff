state: completed
parent_run: openmoji-g1-marginal-corruption-v9-74dc5fd-0ef00ff4-9b9b1699
hypothesis: >-
  v9, under leak-free corruption and sound optimisation, reached 1.506 precision lift
  while a zero-parameter local-continuity statistic reaches 1.893 on the identical
  inputs. That statistic works by subtracting decoded view-unit values, and the encoder
  has no such operand: coordinates enter as an nn.Embedding over 418 unordered
  categories, and the trained table carries no order at all - Spearman -0.136 between
  embedding distance and bin distance, adjacent bins at 0.989 of the all-pairs mean,
  while the output head, which gets a direct gradient from the corpus marginal, reaches
  +0.143 and 0.882. Decoding each token to its view-unit value and projecting Fourier
  features of it should let the model compute the difference it currently cannot, and it
  should then beat the statistic rather than trail it.
expected_information_gain: >-
  This is the one remaining measured candidate after data volume, capacity, the
  corruption level, noise conditioning, objective balance and the density leak have all
  been addressed or eliminated. If a metric input lets the model pass a trivial
  geometric heuristic, Gate G has a working denoiser to build on for the first time. If
  it does not, the failure is not about how the operands are presented, and the honest
  reading is that this model class does not learn the relation.
scope_limits: >-
  Detection-only, so it reconstructs nothing. Single seed, probability 0.35,
  marginal-respecting corruption. Beating the continuity statistic on detection is not
  the same as producing a usable icon; no run in this project has yet produced one.
changed_factors:
  primary: >-
    model.metric_coordinates 0 -> 8, which replaces the categorical coordinate and
    endpoint tables with a projection of Fourier features of the decoded view-unit
    value, using the role-correct affine map selected by segment kind.
  secondary: >-
    model.slot_binding true -> false, disclosed rather than hidden. Slot binding existed
    to break the permutation symmetry of six summed embeddings; concatenating per-slot
    features already distinguishes the slots, so leaving it on would be carrying a
    mechanism that no longer does anything. It is not expected to matter either way.
  parameters: >-
    579,872 -> 525,152, a strict REDUCTION, because the categorical tables are not
    allocated at all. This cannot be confounded with the capacity arm.
  held_fixed: >-
    v9 exactly otherwise: marginal corruption, pooled loss, padding mask, detection
    only, edit-mask heads, the full 2,681-icon split, the 128-icon validation draw and
    its corruption seeds, seed 3101, probability 0.35, batch 16, lr 0.001, eval_every
    60, the 6,300-step cap, held-out-loss selection with patience 8.
