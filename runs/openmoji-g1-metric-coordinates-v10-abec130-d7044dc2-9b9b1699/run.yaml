  improves_on_categorical_input: {passed: true, observed: 2.781, threshold: 1.506}
  structural_safety: {passed: true}
  reproducibility: {passed: true}
  conclusion: >-
    The first trained model in this project to beat a zero-parameter heuristic on a task
    with no shortcut in it, and it does so with 54,720 FEWER parameters than the arm it
    improves on. Encoding coordinates as magnitudes rather than identities takes the
    detector from 1.506 to 2.781 against a free continuity statistic at 1.893. Capacity
    is excluded from both directions: the capacity arm was already eliminated, and this
    change is a strict reduction.
  completes_the_arc: >-
    Four verified defects, none a tuning knob: the loss averaged over groups so four
    fields carried 31% of it; no attention padding mask, so 29.4% of the sequence was
    attended as content; corruption drew uniformly so a token-marginal detector scored
    2.84 with no context at all; and coordinates were encoded as unordered categories so
    no difference was computable. Closing the third is what made the others readable -
    it revealed that v8's 2.806 was mostly the leak, which is why v9's 1.506 rather than
    v8's number is the baseline this run improves on.
  scope: >-
    Detection, not reconstruction. The model identifies which fields were corrupted; it
    does not put back what was there, held-out accuracy is meaningless for a
    detection-only model, and the identity baseline is untouched by this run. What it
    establishes is that the representation and training setup can support learning a
    real geometric relation, which nothing before it had shown.
