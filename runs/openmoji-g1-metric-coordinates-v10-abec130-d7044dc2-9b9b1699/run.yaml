    field-level tokenisation, giving every coordinate its own sequence position rather
    than packing six into one slot at about 16 dimensions each. If that also fails, the
    honest reading is that this model class does not learn the relation and
    PROJECT_PLAN.md section 12's branch 4 - the cached autoregressive model on the same
    codec, which is Gate I - becomes the live branch.
