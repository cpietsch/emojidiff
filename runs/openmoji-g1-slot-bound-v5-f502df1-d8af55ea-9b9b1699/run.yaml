predeclared_criteria:
  note: Declared before launch. No preflight. Baselines above are v2's, on identical draws.
  evaluated_at: the checkpoint selected by held-out loss at corruption 0.35
  primary:
    - id: retained_preservation_moves
      statement: >-
        Held-out retained-token accuracy is at least 0.70, against v2's 0.41283. This is
        the direct consequence of being able to read the input: a field that was never
        corrupted should be easy to keep once the model can tell which field it is. The
        bar is deliberately ambitious rather than a safe margin above 0.41.
    - id: loss_improves
      statement: Held-out loss at the selected checkpoint is below v2's 7.3332648277282715.
    - id: stops_destroying_light_corruption
      statement: >-
        Mean per-icon recovery fraction at corruption 0.10 and 72 px is above zero,
        against v2's -1.2024 and v4's -1.0385. A change of sign, not a margin.
    - id: output_depends_on_input
      statement: >-
        Per-icon Pearson correlation between x_hat_0 render error at corruption 0.05 and
        at 0.35 falls below 0.70, against v2's 0.9122 and v4's 0.8619.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_gate_not_a_prediction:
    - id: retained_preservation_full
      statement: Held-out retained-token accuracy is at least 0.90.
      note: The original Gate G bar, unmet since v1 at 0.3256, 0.4128, 0.4323 and 0.4282.
  falsification_meaning: >-
    If binding fixes the proven invariance but not the behaviour, the encoder defect was
    real and worth fixing on its own terms, yet not the binding constraint. The next
    candidate would then be the prediction objective: a single-shot independent softmax
    over every field cannot express "leave this alone" cheaply, and an edit-mask or
    residual formulation would be the change to test.
  reported_not_gated:
    - the full four-level recovery sweep, against v2's and v4's
    - held-out aggregate and changed accuracy, the selected step, wall time, peak memory
    - whether any render is recognizable, which none has been so far
