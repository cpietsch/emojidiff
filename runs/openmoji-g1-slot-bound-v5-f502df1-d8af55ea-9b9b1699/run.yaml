  - openmoji-g1-noise-conditioned-v4-6b935b2-5a9eaf44-9b9b1699
hypothesis: >-
  The Gate G denoiser could not read its own input because the encoder destroyed which
  coordinate held which value. It summed six lookups from one shared embedding table
  into a single vector per segment, so a segment was an unordered bag of its
  coordinates; in float64 a program and its coordinate-swapped variant produce
  byte-identical logits. Binding each value to its slot restores that information, and
  the model should then be able to preserve fields that were never corrupted, which is
  what held-out retained-token accuracy has been measuring at 0.33 to 0.43 since v1.
expected_information_gain: >-
  This is the first run to address a proven defect rather than a suspected factor. Data
  volume, model capacity, the corruption regime and noise-level information have each
  been eliminated by a predeclared comparison. If binding moves retained-token accuracy
  and the recovery sweep, the Gate G sequence has its explanation and a working
  baseline. If it does not, the defect is real but not the binding constraint, and the
  remaining candidate is the prediction objective itself.
scope_limits: >-
  Fixed-topology and geometry-only, single seed. Exactly the v2 configuration plus 768
  parameters, which is +0.13% and not a plausible capacity effect - v3 already showed a
  3.53x capacity increase does nothing. Success would mean the model reads its input,
  not that its output is usable; no run has yet produced a recognizable icon.
changed_factors:
  primary: model.slot_binding false -> true. 577,552 -> 578,320 parameters.
  held_fixed: >-
    the full 2,681-icon split, the 128-icon validation draw and its corruption seeds,
    seed 3101, corruption probability fixed at 0.35, batch size 16, learning rate 0.001,
    eval_every 60, the 6,300-step cap, the held-out-loss selection policy with patience
    8, the codec, and the bucket. Noise-level conditioning is deliberately off, since
    v4 falsified it; this isolates binding against the v2 baseline.
