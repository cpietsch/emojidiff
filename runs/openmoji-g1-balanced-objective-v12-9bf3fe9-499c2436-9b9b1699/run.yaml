  v10_detection_only: {detector_lift: 2.781}
  free_continuity_statistic: {detector_lift: 1.893}
predeclared_criteria:
  evaluated_at: the checkpoint selected by held-out loss
  primary:
    - id: restores_the_detector
      statement: Detector precision lift exceeds v11's 1.717 and the free statistic's 1.893.
    - id: keeps_a_usable_value_head
      statement: >-
        Held-out changed-token accuracy is at least 0.0296, v11's value. Restoring the
        detector by crippling the value head would be a hollow pass.
    - id: beats_identity
      statement: >-
        Held-out aggregate token accuracy exceeds the identity policy's, computed as
        retained_total / (changed_total + retained_total) from this run's own totals,
        expected near 0.6515. No model in this project has done this.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  degenerate_pass_watch: >-
    Predicting keep everywhere scores exactly identity. Report the keep fraction; a pass
    on beats_identity with it approaching 1.0 is collapse, not success, and
    keeps_a_usable_value_head exists to catch the related failure of a good detector
    paired with a useless value head.
  falsification_meaning: >-
    If balancing the objectives does not let both survive, then one shared encoder cannot
    serve both heads at this scale, and the next step is structural rather than a
    weighting: separate encoders, or a two-stage model that detects first and
    reconstructs conditioned on the detection. Failing instead on beats_identity while
    the detector recovers would mean the value head at ~0.11 is simply too weak, which
    points at the distance-kernel target over the quarter-unit lattice.
  reported_not_gated:
    - the keep fraction, the full held-out breakdown beside identity, the value head's own accuracy
    - the selected step and whether early stopping or the cap ended the run
