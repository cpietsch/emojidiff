schema_version: 1
run_id: openmoji-g1-balanced-objective-v12-9bf3fe9-499c2436-9b9b1699
state: planned
parent_run: openmoji-g1-full-denoiser-v11-27e9956-b9343dcc-9b9b1699
hypothesis: >-
  v10 beat every free detector at 2.781 lift with detection alone. v11 added the value
  head and the detector fell to 1.717, below the free continuity statistic at 1.893,
  leaving aggregate accuracy at 0.5839 against identity's 0.6515. The two heads share an
  encoder and are unequal at chance - log 2 nats for a 2-class keep decision against log
  417 for the value head, a factor of 8.7 - so an unweighted sum lets the value task
  dominate the representation. Scaling the value term by log(2)/log(417) = 0.1149 should
  restore most of the detector while keeping a usable value head, and that combination is
  what the break-even algebra says is needed to beat identity.
expected_information_gain: >-
  Both ingredients required to beat the identity baseline have been demonstrated - a
  2.781 detector in v10 and a 0.1087 value head in v11 - but never together. This tests
  whether they can coexist, which is the single question standing between the project and
  its first model that does something rather than nothing.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, marginal-respecting corruption at 0.35.
  The weight is derived from chance entropies rather than tuned, and is declared here
  before the run; if it turns out to need tuning, that is a different and weaker result
  and must be reported as such.
changed_factors:
  primary: training.value_loss_weight 1.0 -> 0.1149, the ratio of the two chance entropies.
  parameters: unchanged at 525,152
  held_fixed: v11 exactly otherwise.
