  conclusion: >-
    Both ingredients coexist for the first time: the detector is nearly back to v10's
    detection-only 2.781, and changed-token recovery is 2.5x v11's and 5.6x the best any
    earlier model managed, from a single derived weight rather than a tuned one. The
    predeclared criterion is falsified as written, because at the model's own 0.5 gate it
    still loses to identity 0.6086 to 0.6515.
  first_time_result: >-
    With the decode threshold calibrated on a disjoint half of the held-out icons, the
    model reaches 0.6567 against identity's 0.6502 on the other half - the first time
    anything in this project has beaten the trivial policy. The margin is small, about 1%
    relative, and it depends on the calibration: the model's own decode loses by 0.0406.
    Both belong in the claim.
  remains: >-
    The value head is weak at 0.1233 exact-token accuracy, which keeps the break-even
    detection confidence high so only the top few percent of flags pay. The measured next
    step is a distance-kernel target over the quarter-unit lattice, and calibrating the
    gate during training rather than after it.
