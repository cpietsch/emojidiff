  restores_the_detector: {passed: true, observed: 2.569, threshold: 1.893}
  keeps_a_usable_value_head: {passed: true, observed: 0.0738, threshold: 0.0296}
  beats_identity: {passed: false, observed: 0.6086, threshold: 0.6515, note: at the model's own 0.5 gate, which is how the criterion was written}
  structural_safety: {passed: true}
