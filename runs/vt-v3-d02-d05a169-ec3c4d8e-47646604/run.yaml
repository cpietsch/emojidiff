hypothesis: 'A variational transcriber - the new final transcriber whose 18 x 18 stem grid
  passes through a per-cell Gaussian latent (c = 16 channels, chosen by the pre-flight) held
  at a KL budget of C = 2,000 nats per icon - reconstructs held-out icons from its posterior
  mean close to its parent while its latent is smooth at the posterior scale. Pass, on the
  first 339 validation icons, IEEE float32 (TF32 off) greedy decoding, 72 px pixel error,
  bootstrap intervals, all comparisons paired, requires A1 and A3; A2 is a collapse check.
  (A1) reconstruction from mu is non-inferior to the parent re-decoded in float32 on the same
  icons - the upper 95% bound of (VT - parent) is at most +0.015 - and beats the nearest training
  render or its mirror, the 95% interval on the reduction excluding zero. (A2) held-out KL
  within [0.8C, 1.2C] with beta above its floor. (A3) decoding one posterior sample instead
  of mu costs at most 0.010 pixel error, paired mean. Note: the parent was chosen as the best
  of four seeds on these validation icons, so its score is optimistic and non-inferiority
  is the harder half. Decision for the line (three seeds): at least two runs pass A1 and A3
  - fit the flow prior; otherwise stop.'
