supersedes_selection_from: tiny-geometry-f1-v3-seed2701-factorized-5eca9c1-e252438f-bd6c4bbc
hypothesis: >-
  Gate F selected factorized role-uniform corruption as the primary process from
  four-icon fixtures where held-out recovery ran at 96-99%, which the Gate G sequence
  has since shown to be memorization rather than denoising. On the 2,681-icon split,
  path-correlated corruption defines a materially more learnable problem than
  factorized, because its corrupted fields are more identifiable: a training-free
  local-continuity statistic separates them at AUC 0.9333 against factorized's 0.7698.
  A model trained on path-correlated corruption should therefore learn a
  corrupted-field detector that beats the trivial statistic, where the factorized model
  did not.
expected_information_gain: >-
  This re-runs a selection the project made on evidence that no longer supports it, at
  corpus scale and with every improvement the Gate G sequence produced. It either
  identifies a corruption process on which this model class works, or shows that none
  of them does - in which case the model class, not the task, is the problem and
  PROJECT_PLAN.md section 12's fallback interpretations become the live branch.
scope_limits: >-
  Two arms, not three. Whole-path replacement is excluded because it needs a donor pool
  and a compatible-coverage audit: under single-donor compatibility the detectability
  probe replaced only 32 of 13,128 held-out fields, a 0.24% rate, so including it as
  configured would be a null treatment rather than a comparison. Its Gate F fixture
  already measured only 24.74% of legal fields as having an exact compatible donor. It
  is deferred with that reason recorded, not dropped.
  Fixed-topology and geometry-only, single seed, one corruption draw per icon.
arms:
  factorized:
    config: configs/learning/openmoji-g1-process-factorized.yaml
    sha256: 7bfd76b675ed7b916e6061d3c8bf1065fe7cf914574704fb23e176c075066b80
    role: control, and the process Gate F selected
  path_correlated:
    config: configs/learning/openmoji-g1-process-path-correlated.yaml
    sha256: 1ca993912b923805a139d11242b2d7ee9069644609ed835f9ba1924ab2d12974
    role: treatment
  matched: >-
    The two configs differ only in training.corruption_process. Both carry the v5 slot
    binding and the v6 edit mask, the full 2,681-icon split, the 128-icon validation
    draw and its corruption seeds, seed 3101, corruption probability 0.35, batch size
    16, learning rate 0.001, eval_every 60, the 6,300-step cap, and the held-out-loss
    selection policy with patience 8.
