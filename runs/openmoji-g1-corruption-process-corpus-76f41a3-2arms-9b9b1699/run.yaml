  optimizer_step_cap: 6300
  early_stopping: {objective: held_out_loss, patience_evals: 8, min_delta: 0.0}
  resource_cap: {max_steps: 20000, max_storage_gb: 50}
  network: none
predeclared_criteria:
  note: >-
    Declared before either arm runs. Held-out aggregate accuracy is deliberately NOT the
    gated quantity: the identity policy scores 0.6506 and dominates every model so far,
    so an accuracy criterion would reward collapsing to identity. The gated quantity is
    whether a trained model learns a corrupted-field detector better than a
    zero-parameter statistic on the same data.
  evaluated_at: the checkpoint selected by held-out loss, per arm
  primary:
    - id: path_correlated_beats_factorized_on_detection
      statement: >-
        The path-correlated arm's keep-head precision lift over its own base rate
        exceeds the factorized arm's, both measured at a matched 8.573% flag rate.
    - id: a_trained_detector_beats_the_free_one
      statement: >-
        At least one arm's keep-head precision lift exceeds the training-free statistic's
        lift on that same process - 2.13x for factorized, to be measured for
        path-correlated before the arms are compared. This is the criterion that decides
        whether a trained model adds anything at all.
    - id: beats_identity
      statement: >-
        At least one arm's held-out aggregate accuracy exceeds 0.6506198760247951.
        Reported for both arms regardless.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips, both arms.
    - id: reproducibility
      statement: Each arm returns an identical JSON result on a second invocation.
  degenerate_pass_watch: >-
    As in v6, a model predicting keep everywhere scores exactly identity. Report the
    fraction of fields predicted keep for both arms; an arm that passes beats_identity
    while its keep fraction approaches 1.0 has collapsed to the trivial policy and must
    be reported as collapse.
  falsification_meaning: >-
    If neither arm learns a detector beating the free statistic, the conclusion is about
    this model class rather than about either corruption process: a bidirectional
    transformer trained with this objective does not learn a signal that is present and
    trivially extractable. That is a Gate F and Gate G level result and makes
    PROJECT_PLAN.md section 12's fallback interpretations the live branch.
  reported_not_gated:
    - held-out aggregate, changed and retained accuracy for both arms, beside identity
    - keep fraction, detector recall and precision for both arms
    - the four-level render recovery sweep for both arms, beside identity's zero
    - selected step, wall time, peak memory
