schema_version: 1
run_id: openmoji-g1-derived-threshold-v13-7c73fab-1687c462-9b9b1699
state: completed
parent_run: openmoji-g1-balanced-objective-v12-9bf3fe9-499c2436-9b9b1699
hypothesis: >-
  v12 beat the identity baseline, 0.6567 against 0.6502, but only with a decode threshold
  fitted on a disjoint half of the held-out icons; at its own argmax decode it lost,
  0.6086 against 0.6515. That threshold is derivable rather than arbitrary: keeping a
  retained field is always right and changing one is right only if the value head
  re-predicts the same token, so changing pays exactly above p = 1/(1+q) in the value
  head's accuracy q on corrupted fields. Estimating q on TRAIN icons and decoding at that
  threshold should beat identity with no calibration on held-out data at all.
expected_information_gain: >-
  It converts the project's first win over the trivial policy from one that needed a
  post-hoc threshold into one the model simply produces. That is the difference between
  a result that holds up and a result that needs an asterisk, and it costs one run.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, marginal-respecting corruption at 0.35,
  token accuracy rather than renders. The threshold is derived from a first-order
  break-even argument that assumes changing a retained field is never right; that is
  nearly but not exactly true, so the derived threshold is principled rather than optimal.
changed_factors:
  primary: >-
    training.derive_decision_threshold false -> true. After training, the value head's
    accuracy on corrupted TRAIN fields is measured under a corruption draw disjoint from
    the held-out one, the decode threshold is set to 1/(1+q), and the held-out evaluation
    is repeated with it.
  parameters: unchanged at 525,152
  held_fixed: v12 exactly otherwise, including the entropy-balanced value loss weight.
  no_training_change: >-
    This alters decoding and reporting only. The trained weights are identical to v12's;
    the checkpoint should match.
