  v12_value_head_accuracy_on_corrupted_fields: 0.1233
predeclared_criteria:
  evaluated_at: the checkpoint selected by held-out loss, decoded at the derived threshold
  primary:
    - id: beats_identity_without_calibration
      statement: >-
        Held-out aggregate token accuracy at the DERIVED threshold exceeds the identity
        policy's, computed as retained_total / (changed_total + retained_total) from this
        run's own totals. No threshold is fitted on held-out data anywhere in this run.
    - id: improves_on_argmax
      statement: Aggregate accuracy exceeds v12's own argmax decode, 0.6086.
    - id: threshold_is_in_the_expected_region
      statement: >-
        The derived threshold lies between 0.85 and 0.95. The held-out value accuracy was
        0.1233, giving 0.890; a train-split estimate should land near it, and a wildly
        different value would mean the estimator is measuring something else.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  reported_not_gated:
    - the train-split value accuracy, the derived threshold, and the resulting flag rate
    - changed and retained accuracy, which will move in opposite directions by design
  falsification_meaning: >-
    If the derived threshold does not beat identity while a fitted one does, the
    break-even argument is too crude - most likely because changing a retained field is
    not quite never right, or because the value head's accuracy on train icons does not
    transfer. Either would be worth knowing, and the fallback is to derive the threshold
    from a held-out-of-train split rather than from train itself.
