predeclared_outcome:
  overall: partially-falsified
  beats_identity_without_calibration: {passed: true, observed: 0.6519, threshold: 0.6515}
  improves_on_argmax: {passed: true, observed: 0.6519, threshold: 0.6086}
  threshold_is_in_the_expected_region: {passed: false, observed: 0.7842, expected: [0.85, 0.95]}
  structural_safety: {passed: true}
  reproducibility: {passed: true, see: the caveat above}
  conclusion: >-
    The break-even threshold works - this beats identity with nothing fitted on held-out
    data - but by only 0.0003, and the threshold criterion is falsified for an
    informative reason. The value head scores 0.2751 on icons the model trained on
    against 0.1233 held out, so estimating q there gives 0.784 where the held-out
    accuracy implies 0.890, and the model edits more than pays. The fix is the one this
    run's falsification meaning named: estimate q on icons withheld from training.
