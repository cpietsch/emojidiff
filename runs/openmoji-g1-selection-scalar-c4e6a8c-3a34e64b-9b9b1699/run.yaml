predeclared_outcome:
  overall: falsified
  trajectory_reproduces: {passed: true}
  accuracy_selected_renders_better_72: {passed: false, observed: 0.15168741300532557, threshold: 0.14243325995521666}
  accuracy_selected_renders_better_18: {passed: false, observed: 0.16536250302590172, threshold: 0.15277021302348098}
  direction_is_consistent: {passed: false, observed: 5, threshold: 7, of: 12}
  reproducibility: {passed: true}
  design_defect:
    statement: >-
      The three render criteria compared each arm's median independently, which is the
      wrong test for paired data: both probes render the same twelve icons under the
      same corruption draw, so the per-icon difference is the informative quantity.
      That difference is approximately zero at both sizes, with a 95% interval spanning
      about plus or minus 0.02 and a two-sided sign test of p = 0.774. The 6.5% gap
      between the medians is an artifact of an asymmetric per-icon error distribution.
    consequence: >-
      The falsification of the hypothesis stands - selecting the strictly more accurate
      checkpoint did not produce better renders - but the converse is not established.
      At twelve icons the two checkpoints are statistically indistinguishable and this
      run licenses no preference between the scalars.
  conclusion: >-
    Token accuracy is not a reliable stand-in for render quality even under argmax
    decoding, so the argument that motivated this run is wrong or incomplete, and v2's
    changed-token criterion remains correctly recorded as falsified. Which scalar
    should govern selection is not settled by twelve icons; a full 128-icon follow-up
    shrinks the interval about 3.3x and either separates the arms or bounds the effect
    small enough to choose on other grounds.
