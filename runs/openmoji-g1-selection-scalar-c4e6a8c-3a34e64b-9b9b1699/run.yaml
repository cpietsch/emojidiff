predeclared_criteria:
  note: >-
    Declared before the run. The held-out scalars for both arms are already known from
    v2's committed trace and are restated above; what is not known is how either
    checkpoint renders. No preflight was run.
  primary:
    - id: trajectory_reproduces
      statement: >-
        The fixed-budget run's metrics.jsonl matches the first 1,320 rows of v2's
        metrics.jsonl exactly. This is a precondition: if it fails, the two arms are not
        the same training trajectory and the comparison is void.
    - id: accuracy_selected_renders_better_72
      statement: >-
        Median RGBA MAE of `x_hat_0` against `x_0` at 72 px is below 0.14243325995521666,
        the loss-selected arm's value on the identical icons and corruption draw.
    - id: accuracy_selected_renders_better_18
      statement: Median RGBA MAE at 18 px is below 0.15277021302348098.
    - id: direction_is_consistent
      statement: >-
        At 72 px the accuracy-selected arm has lower RGBA MAE on at least 7 of the 12
        icons, so a median win is not carried by a single outlier.
    - id: reproducibility
      statement: Both the training run and the render probe reproduce identical artifacts.
  falsification_meaning: >-
    If the loss-selected checkpoint renders better despite lower token accuracy, the
    argmax argument is wrong or incomplete, held-out loss stays the selection scalar,
    and v2's changed-token criterion remains correctly recorded as falsified. That
    outcome is as useful as the predicted one and must not be tuned away.
  reported_not_gated:
    - absolute render error for both arms, and whether either output is recognizable
    - per-icon render error, so a split decision is visible rather than averaged away
