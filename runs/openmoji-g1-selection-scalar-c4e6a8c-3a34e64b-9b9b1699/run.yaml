hypothesis: >-
  Held-out accuracy, not held-out loss, is the correct checkpoint-selection scalar for
  this project as it currently decodes. `predict_clean_geometry` takes an argmax over
  the legal vocabulary, so the rendered artifact depends only on which token wins and
  not on the probability mass cross-entropy measures. The accuracy-selected step-1,320
  checkpoint has strictly higher held-out aggregate, changed, and retained accuracy
  than the loss-selected step-840 checkpoint, so it should render closer to `x_0` on
  the identical held-out icons and corruption draw.
expected_information_gain: >-
  v2's primary criterion passed under one reading and failed under the other, and
  CURRENT.md records settling the scalar question, with a declared reason, as the next
  action. Deciding it by measuring the thing the project actually delivers - the render
  - rather than by arguing about metrics removes a recurring source of post-hoc
  freedom from every later Gate G run. It costs about two minutes of GPU and CPU.
scope_limits: >-
  The conclusion is conditional on the decode rule. Under argmax decoding the
  distribution beyond the winning token is discarded, so calibration cannot affect the
  artifact. If a later sampler draws from the distribution instead, calibration becomes
  relevant again and this result does not transfer. Twelve held-out icons at one
  corruption draw and one probability; a single seed.
  Both checkpoints are expected to render as scribble. A win here means one rule picks
  a measurably closer checkpoint, not that either output is usable.
method: >-
  Train the identical v2 configuration at a fixed 1,320-step budget with no selection
  policy, reproducing v2's own trajectory and writing its final-step checkpoint. Then
  run the read-only render probe over both checkpoints with identical icons, sizes,
  and corruption seeds, and compare median RGBA error against `x_0`.
