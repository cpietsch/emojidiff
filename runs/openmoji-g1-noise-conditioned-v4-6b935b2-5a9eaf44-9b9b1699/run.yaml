diagnosis_run: openmoji-g1-corruption-sweep-71a080a-4levels-9b9b1699
hypothesis: >-
  The Gate G denoiser produced output near-independent of its input because it trained
  at one fixed corruption level and was never told the level, so it had no reason to
  learn how much to trust `x_t` and settled on a group-conditioned prior. Sampling a
  corruption level per example across 0.05 to 0.50 and conditioning the model on that
  level makes the output actually depend on the input: the model stops destroying
  lightly corrupted inputs, and its predictions at 0.05 and 0.35 stop being nearly the
  same picture.
expected_information_gain: >-
  This is the first Gate G run that targets the diagnosed mechanism rather than a
  resource. If it works, the earlier recovery numbers become interpretable as denoising
  for the first time and the gate has a path forward. If it does not, the failure is
  not about noise-level information and the next candidates are an edit-mask or
  residual objective, which are larger changes.
scope_limits: >-
  Fixed-topology and geometry-only, single seed. Model size is v2's, plus 3,168
  parameters of noise projection, because v3 showed capacity is not the constraint.
  Success here would mean the model reads its input, not that its output is usable; the
  renders have never yet produced a recognizable icon at any setting.
changed_factors:
  primary: >-
    Two inseparable halves of one mechanism: corruption level sampled per example over
    0.05 to 0.50 instead of fixed at 0.35, and 16 sinusoidal noise-level conditioning
    features supplied to the model. Sampling without telling the model would leave it
    unable to use the level; telling it without varying the level would leave it a
    constant. They are deliberately not separated, and this is recorded as a two-factor
    change rather than presented as one.
  held_fixed: >-
    the full 2,681-icon split, the 128-icon validation draw and its corruption seeds,
    seed 3101, batch size 16, learning rate 0.001, eval_every 60, the 6,300-step cap,
    the held-out-loss selection policy with patience 8, the codec, and the bucket.
  model_parameters: {v2: 577552, v4: 580720}
  evaluation: >-
    Held-out evaluation and checkpoint selection stay at corruption 0.35, exactly the
    task v2 and v3 were measured on.
