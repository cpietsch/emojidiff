predeclared_criteria:
  note: >-
    Declared before launch. No preflight. The baseline figures above are v2's, measured
    on the same 32-icon sweep draw and the same 128-icon validation draw.
  evaluated_at: the checkpoint selected by held-out loss at corruption 0.35
  primary:
    - id: stops_destroying_light_corruption
      statement: >-
        Mean per-icon recovery fraction at corruption 0.10 and 72 px is above zero,
        against v2's -1.2024. Above zero means the model improves a lightly corrupted
        input rather than damaging it, which is a qualitative change of sign.
    - id: output_depends_on_input
      statement: >-
        The per-icon Pearson correlation between `x_hat_0` render error at corruption
        0.05 and at 0.35 falls below 0.70, against v2's 0.9122. This is the direct
        measure of the diagnosed mechanism.
    - id: light_corruption_damage_collapses
      statement: >-
        Mean recovery fraction at corruption 0.05 is above -0.5, against v2's -4.6517.
    - id: does_not_wreck_the_trained_task
      statement: >-
        Held-out loss at the selected checkpoint, evaluated at 0.35, is below 8.0. v2
        reached 7.3333 while training only at 0.35, so some loss at that single level is
        expected from spreading training across a range; a large regression would mean
        the range was too wide rather than that conditioning failed.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_gate_not_a_prediction:
    - id: retained_preservation
      statement: Held-out retained-token accuracy at 0.35 is at least 0.90.
      note: >-
        Carried from v1, v2 and v3 at 0.3256, 0.4128 and 0.4323. This run targets the
        mechanism behind that number, so movement here is the most informative single
        figure even though the bar is not predicted to be met.
  falsification_meaning: >-
    If the correlation stays high and the model still destroys lightly corrupted inputs,
    noise-level information was not the missing piece. The next candidates are then
    structural rather than informational: predict an edit mask or a residual against
    `x_t` so that copying is the default, and separately condition on which fields were
    corrupted as a diagnostic upper bound to separate identification failure from
    prediction failure.
  reported_not_gated:
    - the full four-level recovery sweep, for direct comparison with v2's
    - held-out aggregate, changed and retained accuracy at 0.35
    - the selected step, whether the cap or early stopping ended the run, wall time and peak memory
