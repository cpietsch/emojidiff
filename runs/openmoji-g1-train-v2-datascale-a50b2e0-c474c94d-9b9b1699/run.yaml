predeclared_criteria:
  note: >-
    Declared before launch. A disclosed 60-step sizing preflight on the full 2,681-icon
    split was run first to size wall time and memory. It reported 61.7 s wall including
    data loading, 290.1 MiB peak CUDA memory, train token accuracy 0.0793, held-out
    loss 10.5741, and held-out changed-token accuracy 0.0228 at step 60. The
    corresponding v1 step-60 numbers are held-out loss 10.7155 and changed 0.0219, so
    the preflight distinguishes nothing about the outcome and is disclosed rather than
    hidden. The full run was not observed beforehand.
  evaluated_at: the checkpoint selected by held-out loss, not the last trained step
  primary:
    - id: data_scale_lowers_held_out_loss
      statement: >-
        The minimum held-out loss is below 9.7932, the v1 baseline minimum on the
        identical validation draw and corruption seeds.
    - id: generalization_gap_narrows
      statement: >-
        At the selected step, train token accuracy minus held-out aggregate accuracy is
        below 0.1831, the v1 value at its own selected step. Train token accuracy is a
        16-sample per-step figure, so the mean over the ten training steps ending at
        the selected step is used for both arms.
    - id: held_out_changed_recovery_improves
      statement: >-
        Held-out changed-token accuracy is at least 1.5x the v1 baseline value of
        0.043855, that is at least 0.065782.
    - id: later_held_out_optimum
      statement: >-
        The selected step is later than v1's step 240, so more data supports longer
        useful training rather than merely reaching the same optimum sooner.
    - id: structural_safety
      statement: >-
        Locked-path exactness holds and the canonical checkpoint round-trips at the
        selected step.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_gate_not_a_prediction:
    - id: retained_preservation
      statement: Held-out retained-token accuracy is at least 0.90.
      note: >-
        Carried forward from v1, where it was falsified at 0.3256. It is recorded so
        the Gate G bar is not quietly dropped, but this run is not predicted to meet
        it: 10.5x data at an unchanged 577,552 parameters is not expected to close a
        0.33-to-0.90 gap. If it is met, that is a stronger result than the hypothesis.
  reported_not_gated:
    - the complete held-out trace and the step at which loss turns upward, if it does
    - held-out aggregate accuracy and retained-token accuracy at the selected step
    - the last-trained-step held-out numbers, for the overfitting comparison
    - wall time, peak CUDA memory, and whether early stopping or the cap ended the run
  chance_level: >-
    Random legal-token choice is about 0.0035 for endpoints over 289 bins and 0.0024
    for controls over 417 bins.
