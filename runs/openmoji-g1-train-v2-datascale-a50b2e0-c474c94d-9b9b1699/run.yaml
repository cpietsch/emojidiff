schema_version: 1
run_id: openmoji-g1-train-v2-datascale-a50b2e0-c474c94d-9b9b1699
state: completed
parent_run: openmoji-g1-train-v1-native-c9bf1b9-f2a06ca5-9b9b1699
hypothesis: >-
  The v1 falsification was a data-scale failure, not an optimization or plumbing
  failure. Training the identical 577,552-parameter denoiser on the full 2,681-icon
  family-disjoint train split of the dominant P32/T128 bucket, instead of a 256-icon
  subsample, generalizes materially better on the identical 128-icon held-out draw:
  a lower held-out loss minimum, a narrower train/held-out gap, and higher
  changed-token recovery at the selected checkpoint.
expected_information_gain: >-
  v1 established that the representation is learnable at real icon diversity but that
  256 icons are too few to generalize. This run decides whether 10.5x more data is
  sufficient at this model size, or whether the next factor is model capacity,
  augmentation, or the corruption schedule. It is the cheapest test that separates
  those, because it changes only the data.
scope_limits: >-
  Fixed-topology and geometry-only. Not unconditional generation, not topology
  generation, not a style or AR comparison. A single seed, so small differences are
  not interpretable across seeds. Group/subgroup conditioning and exact path locks are
  unchanged from v1.
changed_factors:
  primary: train_samples 256 -> 2681 (the complete family-disjoint train split)
  secondary: >-
    The fixed 600-step budget becomes a 6,300-step cap plus held-out-loss early
    stopping with patience 8 evaluations. This is a stopping rule, not a change to the
    learning problem. It is disclosed as a second change and controlled for by reading
    the v1 baseline at its own held-out loss minimum, step 240, rather than at its
    reported step 600. Both arms are therefore compared under the same selection rule.
  held_fixed: >-
    model (d_model 96, 4 heads, 2 layers, ff 192, 577,552 parameters), seed 3101,
    corruption probability 0.35, batch size 16, learning rate 0.001, eval_every 60,
    validation_samples 128 drawn by the identical hash order, codec, bucket, and the
    held-out corruption seeds.
  step_budget_rationale: >-
    6,300 steps x 16 / 2,681 icons is 37.6 epochs, matched to v1's 600 x 16 / 256 =
    37.5 epochs, so the cap is not an unmatched advantage. Early stopping is expected
    to end the run before the cap.
