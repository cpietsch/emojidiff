  structural_safety: {passed: true}
  reproducibility: {passed: true}
  degenerate_pass_watch:
    fired: true
    statement: >-
      The model predicts keep on 91.4% of held-out fields. It moved most of the way to
      the trivial policy and stopped just short, landing strictly worse than both v5 and
      identity: six times fewer corrupted fields recovered than v5, while still not
      keeping as reliably as doing nothing.
  conclusion: >-
    The edit mask did what it was built to do and stopped the model destroying its
    input, converting an actively harmful model into a nearly inert one. It collapsed
    onto keep because corrupted fields are not detectable: recall 0.1058, precision
    0.4312 against a 0.3494 base rate, a lift of 1.23x. A coordinate resampled uniformly
    from a 289-value legal vocabulary is a plausible coordinate, so telling it apart
    requires already knowing the icon - detection is not an easier sub-problem than
    denoising, it is the same problem. With 65% of fields uncorrupted and no reliable
    way to find the rest, predicting keep is loss-minimising and the model found it.
  gate_level_finding: >-
    Factorized role-uniform categorical corruption at p=0.35 over a 289/417-value
    coordinate vocabulary produces states from which the corruption is not identifiable,
    and therefore not invertible, by a model of this class. Gate F selected this process
    as primary on four-icon fixtures at 96-99% held-out recovery, which does not survive
    contact with 2,681 icons; that comparison should be re-read as a memorization
    comparison rather than a denoising one.
