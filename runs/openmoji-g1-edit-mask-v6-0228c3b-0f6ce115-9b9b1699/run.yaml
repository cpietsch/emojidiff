predeclared_criteria:
  note: >-
    Declared before launch. No preflight. Held-out loss is not comparable across this
    change, because the edit-mask objective is a different loss; it is reported, and
    still used for checkpoint selection, but not gated.
  evaluated_at: the checkpoint selected by held-out loss at corruption 0.35
  primary:
    - id: beats_identity
      statement: >-
        Held-out aggregate token accuracy exceeds 0.6506198760247951, the identity
        policy. This is the criterion every earlier run should have carried.
    - id: retains_what_identity_retains
      statement: >-
        Held-out retained-token accuracy is at least 0.95, against v5's 0.5408 and
        identity's 1.0. A model that can say keep should keep almost everything that
        was never corrupted.
    - id: recovers_more_than_identity
      statement: >-
        Held-out changed-token accuracy exceeds v5's 0.07869509228788095, so the gain
        is not bought purely by copying. Identity scores 0.0 here, so beating identity
        on aggregate while scoring 0 on changed would be a degenerate pass and this
        criterion exists to catch it.
    - id: stops_damaging_light_corruption
      statement: >-
        Mean per-icon recovery fraction at corruption 0.10 and 72 px is at least 0,
        against v5's -0.7607. Identity scores exactly 0, so this is the render-space
        form of "no worse than doing nothing".
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_gate_not_a_prediction:
    - id: retained_preservation_full
      statement: Held-out retained-token accuracy is at least 0.90.
      note: >-
        The original Gate G bar, unmet since v1 at 0.3256 through 0.5408. This run is
        the first with a mechanism that could plausibly meet it, which is why the
        primary criterion above is set higher still at 0.95.
  degenerate_pass_watch: >-
    A model that predicts keep everywhere scores exactly identity: 0.6506 aggregate,
    1.0 retained, 0.0 changed. That would pass beats_identity and
    retains_what_identity_retains while failing recovers_more_than_identity, and must
    be reported as a degenerate collapse to the trivial policy rather than as a win.
    The fraction of fields predicted keep is reported for exactly this reason.
  falsification_meaning: >-
    If the model still cannot clear the trivial policy even when identity is one
    prediction away, the problem is not the objective's expressiveness and the
    fixed-topology geometry-denoising formulation itself is in question. That would be a
    Gate G-level negative result and should be written up as one rather than patched.
  reported_not_gated:
    - the fraction of held-out fields the model predicts keep, to detect collapse
    - held-out loss, which is not comparable across the objective change
    - the full four-level recovery sweep against v2, v4, v5 and identity
    - the selected step, wall time, and peak memory
