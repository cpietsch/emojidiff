schema_version: 1
run_id: openmoji-g1-edit-mask-v6-0228c3b-0f6ce115-9b9b1699
state: completed
parent_run: openmoji-g1-slot-bound-v5-f502df1-d8af55ea-9b9b1699
hypothesis: >-
  Every Gate G model so far scores below the identity policy on held-out token accuracy
  because the objective makes identity expensive: each field is an independent softmax
  over a 289- or 417-way vocabulary, so "leave this one alone" costs as much as
  inventing a new value, and 26,030 of 40,008 held-out fields are uncorrupted. Adding a
  per-field keep-or-change decision, and copying the input wherever it says keep, makes
  identity reachable as predict-keep-everywhere. The model should then clear the
  identity baseline rather than fall 0.27 short of it.
expected_information_gain: >-
  This is the first Gate G criterion set against the trivial policy rather than against
  noise, and it tests the last candidate standing after data volume, capacity, the
  corruption regime, noise-level information and encoder slot-blindness were each
  eliminated by a predeclared comparison. Clearing identity would be the first evidence
  in the sequence that the model does something useful rather than something harmful.
scope_limits: >-
  Fixed-topology and geometry-only, single seed. Exactly v5 plus 1,552 parameters of
  keep heads, +0.27%, which is not a plausible capacity effect given v3 showed a 3.53x
  increase does nothing. Beating identity in token space would not mean the output is a
  recognizable icon; no run in this sequence has produced one.
changed_factors:
  primary: model.edit_mask false -> true. 578,320 -> 579,872 parameters.
  objective_change: >-
    Training loss becomes keep-or-change cross-entropy plus value cross-entropy on
    changed fields only, and decoding copies the input token wherever the model predicts
    keep. Accuracy is measured on the gated prediction, so it stays directly comparable
    with v1 through v5 and with the identity baseline.
  held_fixed: >-
    slot binding on, the full 2,681-icon split, the 128-icon validation draw and its
    corruption seeds, seed 3101, corruption fixed at 0.35, batch size 16, learning rate
    0.001, eval_every 60, the 6,300-step cap, the held-out-loss selection policy with
    patience 8, the codec, and the bucket. Noise conditioning stays off, since v4
    falsified it.
