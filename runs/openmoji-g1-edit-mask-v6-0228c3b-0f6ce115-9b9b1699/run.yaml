  beats_identity: {passed: false, observed: 0.6119276144771045, threshold: 0.6506198760247951}
  retains_what_identity_retains: {passed: false, observed: 0.9334613907030349, threshold: 0.95}
  recovers_more_than_identity: {passed: false, observed: 0.013163542709972815, threshold: 0.07869509228788095}
