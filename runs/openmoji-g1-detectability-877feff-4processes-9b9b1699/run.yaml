recorded_retroactively: true
hypothesis: >-
  Descriptive, and a check on the conclusion the previous run drew. Gate G was closed on
  the reading that factorized role-uniform corruption is not identifiable, inferred from
  a trained detector reaching 0.1058 recall at 1.23x precision lift. The competing
  reading is that the corruption is identifiable and the model failed to learn it. A
  parameter-free local-continuity statistic distinguishes the two without training.
scope_limits: >-
  48 held-out icons, one corruption draw per icon per process, one fixed statistic. The
  statistic is a floor on detectability, not a ceiling: it uses no learned parameters,
  so a result above chance proves identifiability while a result at chance would not
  prove the converse.
