  primary:
    - id: lifts_the_value_head
      statement: >-
        The withheld value accuracy exceeds v14's 0.2220. This is the quantity the
        intervention targets and the one every downstream term depends on.
    - id: widens_the_margin_over_identity
      statement: >-
        The held-out aggregate margin over identity exceeds v14's +0.0027, with the
        threshold still derived and nothing fitted on held-out data.
    - id: lowers_the_derived_threshold
      statement: >-
        The derived threshold falls below v14's 0.8183, which follows arithmetically
        from a higher value accuracy and is a consistency check on the estimate.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  reported_not_gated:
    - changed and retained accuracy, and the resulting edit rate against v14's 4%
    - the detector lift, which should be unaffected but is worth watching
  falsification_meaning: >-
    If a distance-aware target does not raise the value head's accuracy, then predicting
    the exact bin is not hard because the target shape hides partial credit, and the
    remaining explanations are about the model: a single shared encoder serving both
    heads, or a 289/417-way output being the wrong parameterisation for a metric quantity
    that might be better regressed than classified. Both are larger changes than this one
    and should be predeclared separately.
