  overall: falsified
  lifts_the_value_head: {passed: false, observed: 0.1623, threshold: 0.2220, note: exact-token terms}
  widens_the_margin_over_identity: {passed: false, observed: 0.0014, threshold: 0.0027}
  lowers_the_derived_threshold: {passed: false, observed: 0.8604, threshold: 0.8183}
  structural_safety: {passed: true}
  reproducibility: {passed: true}
  verdict_on_the_criteria: >-
    All three primary criteria are stated in exact-token terms and all three fail, while
    both measures this run committed to REPORTING show a clear success: mean absolute
    view-unit error falls 27% and median 33%, and paired per-icon render recovery nearly
    triples, 0.1246 against 0.0447 at 72 px with both confidence intervals excluding
    zero. That combination is a verdict on the criteria rather than on the intervention.
    Exact-token accuracy is anti-correlated with what this project is trying to produce,
    which is what the task-formulation lens argued before this run existed.
  recording_note: >-
    On a first pass I also compared the two models by their MEDIAN x_hat_0 error, 0.16074
    against 0.16985, and read v15 as worse. That is the same mistake this session already
    caught once: on paired data, compare the pairs. Both models render identical
    corrupted inputs, so the paired per-icon recovery is the correct statistic.
  changes:
    demote_exact_token_accuracy: >-
      Mean absolute view-unit error and paired render recovery become the primary
      reported metrics; exact-token accuracy stays secondary so nothing already published
      is withdrawn.
    correct_the_gate: >-
      The break-even rule p > 1/(1+q) is derived in exact-token terms, so a value head
      that is closer but not exacter raises its own threshold - v15's went to 0.8604 -
      and edits less of what it could improve. A gate derived from expected geometric
      gain is the next run.
