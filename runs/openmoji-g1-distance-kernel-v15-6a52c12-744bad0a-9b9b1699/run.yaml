state: planned
parent_run: openmoji-g1-withheld-calibration-v14-dbfc543-359d06bd-9b9b1699
hypothesis: >-
  v14 beats the identity baseline by 0.0027 with nothing fitted on held-out data, but
  edits only 4% of fields despite a detector running at 2.569 lift, far above the free
  continuity statistic's 1.893. The reason is a single number: the value head reaches
  0.222 on withheld corrupted fields, which pins the break-even decode threshold at
  1/(1+q) = 0.818. It predicts an exact bin on a quarter-unit lattice through a
  289/417-way softmax, so a confident one-view-unit miss costs 10.0187 - identical to a
  far miss. Spreading the target by distance gives proximity gradient, should raise q,
  and every downstream term follows: a lower threshold, more fields edited, a larger
  margin over identity.
expected_information_gain: >-
  This is the last measured step in the chain the session established. If it lifts q the
  project has a denoiser whose margin over the trivial policy can be pushed rather than
  merely demonstrated. If it does not, the value task is hard for a reason the target
  shape does not address, and the next question is about the model rather than the loss.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, marginal-respecting corruption at 0.35,
  token accuracy rather than renders. Exact-token accuracy remains the reported metric,
  so the distance kernel has to earn its keep through better exact predictions, not by
  changing what counts as correct.
changed_factors:
  primary: >-
    training.value_distance_tau 0 -> 1.0, spreading the value target as
    exp(-|b - t| * 0.25 / tau) over the legal bins. tau is in view units, so 1.0 spans
    four quarter-unit bins either side.
  parameters: unchanged at 525,152
  held_fixed: >-
    v14 exactly otherwise: metric coordinates, marginal corruption, pooled loss, padding
    mask, entropy-balanced value weight, 256 withheld calibration icons, derived decode
    threshold, seed 3101, batch 16, lr 0.001, the 6,300-step cap, patience 8.
  note_on_loss_scale: >-
    The soft target has entropy, so the distance-kernel loss is bounded below by that
    entropy rather than by zero and its absolute value is not comparable with v14's.
    Held-out loss remains the selection signal within this run, which is internally
    consistent; only the detector, value accuracy and identity margin are compared
    across runs.
