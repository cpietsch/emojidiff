  primary:
    - id: beats_the_broken_baseline
      statement: Precision lift over the base rate exceeds v7's 1.365.
    - id: reaches_the_panel_lower_bound
      statement: >-
        Precision lift is at least 1.55, the lower end of both lenses' intervals. Below
        this the corrections did not materially change what the model learns, whatever
        they did to the measurement.
    - id: uses_more_of_its_budget
      statement: >-
        The selected step exceeds v7's 660 and the run does not stop before step 1,140.
        A sound early-stopping signal should not fire as quickly as a noisy one.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_reference_not_a_prediction:
    - id: matches_the_free_detector
      statement: Precision lift reaches 2.13, the zero-parameter continuity statistic.
      note: >-
        Neither lens predicts this and I do not either; both expect the residual gap to
        be representational. Recorded so the real bar stays visible.
  falsification_meaning: >-
    If the corrections do not move the detector, then the defects were real but not
    load-bearing, the earlier plateaus stand as measured, and the remaining candidate is
    representational - either the six-fields-summed-into-one-slot bottleneck that the
    architecture lens measured a ceiling ladder for, or the non-ordinal coordinate
    embedding the representation lens measured directly. Those are the next two runs and
    they are separable.
  reported_not_gated:
    - detector recall and precision at the model's own threshold and at the base flag rate
    - held-out field-pooled loss, which is a new scalar and not comparable with v7's
    - whether early stopping or the cap ended the run, wall time, peak memory
