diagnosis: five-lens diagnostic panel over this codebase, with both defects verified independently
hypothesis: >-
  The Gate G sequence was optimised and model-selected on a broken signal. The loss
  averaged cross-entropy over per-(segment kind, coordinate slot) groups rather than
  over fields, so the four single-field QUAD groups carried 4/13 of the coordinate loss
  against 40,004 other fields - a measured 5,287x per-field weight ratio - and held-out
  loss, which is the checkpoint-selection and early-stopping signal, was roughly 31%
  four individual fields. Separately, no attention padding mask was passed, so about
  29% of the sequence was attended as content. Correcting both should raise the trained
  detector's precision lift above v7's 1.365 and let the run use materially more of its
  6,300-step budget than v7's 1,140.
expected_information_gain: >-
  Every plateau claim in this series - that data, capacity, the corruption regime and
  noise-level information were each eliminated - was declared by a held-out scalar that
  was 31% four fields, on runs stopped at 6 to 24% of their step cap. This run
  establishes whether those plateaus were real or were noise-triggered early stops. It
  is a prerequisite for any representational conclusion, and it costs one training run.
scope_limits: >-
  Detection-only, so it reconstructs nothing and held-out accuracy is meaningless here;
  the gated quantity is detector quality. Field-pooled held-out loss is a different
  scalar from v7's group-pooled one and the two are NOT comparable in value - only the
  detector metrics and the selected step are. Single seed, factorized p=0.35.
changed_factors:
  primary: >-
    Two verified defect corrections applied together: training.pool_loss_over_fields
    and model.mask_padding. They are bundled deliberately and this is disclosed rather
    than presented as one factor. Neither is a tuning knob; both are bugs. Separating
    them would need two runs to establish a baseline that is sound in neither arm, and
    the padding mask cannot be assessed under a loss that is 31% four fields.
  parameters: unchanged at 579,872
  held_fixed: >-
    v7 exactly otherwise: detection_only, slot binding on, edit-mask heads, the full
    2,681-icon split, the 128-icon validation draw and its corruption seeds, seed 3101,
    corruption 0.35, batch 16, lr 0.001, eval_every 60, the 6,300-step cap, and the
    held-out-loss selection policy with patience 8.
