  conclusion: >-
    Two verified defect fixes, no new parameters and no architectural change, took the
    trained detector from 1.365 to 2.806 and the selected step from 660 to 6,180 with no
    early stop. Both lenses' intervals were exceeded.
  caveat_that_matters_more:
    statement: >-
      A zero-parameter, zero-context detector that scores each field by how rare its own
      token is for its own role reaches 0.9887 precision and 2.831 lift at the same flag
      rate, and 0.9962 at a 5% flag rate. v8 matches it rather than beating it.
      Corruption draws uniformly from the full legal vocabulary, so many replacements
      land on tokens real icons never use: precision lift under factorized role-uniform
      corruption is mostly a marginal-density test, and v8 has most likely learned the
      corpus marginal rather than the geometry.
    evidence: reports/learning/marginal-density-detector.json
  invalidates: >-
    Every plateau in the Gate G sequence was declared by a held-out scalar that was ~31%
    four fields, on runs stopped at 6-24% of their step cap. The eliminations of data
    volume (v2), model capacity (v3), the corruption regime (sweep) and noise-level
    conditioning (v4) are no longer admissible as measured. Their numbers stand; their
    interpretation as plateaus does not.
  withdraws: >-
    Two of my own earlier conclusions. "The encoder does not represent the signal" rested
    on a frozen-encoder probe that shares one weight vector across all six slots, which is
    mis-specified and a lower bound, and on v7's broken training; the same probe on v8
    reaches AUC 0.6604 against 0.5797. And the architecture lens's ceiling ladder
    predicted ~1.30 lift at 16 dims per field, which v8 exceeds at that same width.
