  falsification_meaning: >-
    If the corrections do not move the detector, then the defects were real but not
    load-bearing, the earlier plateaus stand as measured, and the remaining candidate is
    representational - either the six-fields-summed-into-one-slot bottleneck that the
    architecture lens measured a ceiling ladder for, or the non-ordinal coordinate
    embedding the representation lens measured directly. Those are the next two runs and
    they are separable.
