predeclared_criteria:
  note: Measured by scripts/detector_report.py at the matched 8.573% flag rate.
  evaluated_at: the checkpoint selected by held-out loss
  primary:
    - id: beats_the_free_geometric_detector
      statement: >-
        Precision lift exceeds 1.893, the local-continuity statistic measured under this
        same corruption process. This is the first criterion in the project that a model
        can only pass by using geometry, because the density shortcut is gone.
    - id: not_explained_by_density
      statement: >-
        Precision lift exceeds 1.20. The marginal-density detector scores 0.771 here, so
        anything at or below about 1.0 would mean the model learned nothing this process
        did not hand it.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  reported_not_gated:
    - detector recall and precision at the model's own threshold and at the base flag rate
    - the selected step and whether early stopping or the cap ended the run
    - held-out field-pooled loss, not comparable across corruption processes
  falsification_meaning: >-
    If the model cannot beat a zero-parameter continuity statistic once the density
    shortcut is removed, then v8's apparent success was entirely the leak, and the
    conclusion is that this model class does not learn the geometric relation even under
    sound optimisation. That would make the representational interventions - per-field
    tokenisation, or ordinal coordinate features - the next runs, and both were measured
    and argued for by the diagnostic panel.
