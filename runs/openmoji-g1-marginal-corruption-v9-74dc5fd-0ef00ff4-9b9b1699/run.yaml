schema_version: 1
run_id: openmoji-g1-marginal-corruption-v9-74dc5fd-0ef00ff4-9b9b1699
state: completed
parent_run: openmoji-g1-sound-optimisation-v8-949e0e5-4feee442-9b9b1699
hypothesis: >-
  v8's detector reached 2.806 precision lift, but a zero-parameter detector that knows
  only the corpus marginal reaches 2.831 on the same data, so v8 matched a density test
  rather than learning geometry. Factorized corruption draws replacements uniformly from
  the full legal vocabulary, so many land on tokens real icons never use. Drawing them
  from the corpus distribution for the field's role instead removes that shortcut: the
  marginal detector falls to 0.771 while the local-continuity signal survives at 1.893.
  Under this leak-free process the model must use the surrounding geometry, and this run
  measures for the first time how much of that signal it can actually learn.
expected_information_gain: >-
  This is the first honest detection benchmark in the project. Every earlier detector
  number - v6 1.234, v7 1.365, v8 2.806, and the free references at 2.13 and 2.83 - was
  measured on a process whose corruption is identifiable from a token marginal alone. A
  trained model that beats the continuity statistic HERE has learned geometry; one that
  does not has not, and no amount of the earlier numbers would have told us which.
scope_limits: >-
  Detection-only, so it reconstructs nothing and held-out accuracy is meaningless here.
  Single seed, probability 0.35. Not comparable with v8 in absolute terms: the task is
  strictly harder because the easy fraction of corruptions has been removed, so a lower
  lift than v8's 2.806 is expected and is not a regression.
changed_factors:
  primary: training.corruption_process factorized -> marginal.
  parameters: unchanged at 579,872
  held_fixed: >-
    v8 exactly otherwise: pool_loss_over_fields, mask_padding, detection_only, slot
    binding, edit-mask heads, the full 2,681-icon split, the 128-icon validation draw
    and its corruption seeds, seed 3101, probability 0.35, batch 16, lr 0.001,
    eval_every 60, the 6,300-step cap, held-out-loss selection with patience 8.
  marginal_estimated_from: >-
    train programs only, so no held-out information reaches the corruption applied to
    held-out icons.
