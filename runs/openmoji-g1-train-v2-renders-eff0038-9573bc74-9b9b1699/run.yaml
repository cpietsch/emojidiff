  improvement_over_corrupted_input_72: 0.16
  visual_assessment: >-
    None of the twelve predictions is a recognizable icon. Both x_t and x_hat_0 read as
    scribble. Large flat colour regions survive because fills, styles, and topology are
    not corrupted, so a few icons keep a recognisable palette - the warning triangle
    stays yellow, the tumbler stays orange - but the stroke geometry is destroyed in
    every case. The prediction is visibly less tangled than the corrupted input on some
    icons and indistinguishable on others.
  identical_rerun: true
  render_metrics_sha256: 703c68a6fbe3304327136c1f4f09e59c0b9a0a19cd2435cd431bdba33f44434c
  sheet_sha256: 2e79da3ca8f92e3f6d8777c5edd5393b85bcdc16a5b13781daed1c371ef68b92
  conclusion: >-
    The Gate G scalars oversell the visual result substantially. A 16% reduction in
    median RGBA error against the corrupted input is not a recovered icon, and no
    reading of 0.2886 aggregate token accuracy should have been taken as one. It also
    shows that at 0.35 the corrupted input is already visually destroyed, so the
    training distribution sits at a corruption level where the visual task may be
    unachievable for any model of this size. That makes the corruption schedule a
    first-class candidate factor rather than a secondary one.
