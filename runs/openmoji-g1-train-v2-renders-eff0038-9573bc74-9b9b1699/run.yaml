hypothesis: >-
  A read-only probe, not a learning claim, so it carries no predeclared pass/fail
  criteria. The question is descriptive: at the v2 selected checkpoint's 0.2886
  held-out aggregate and 0.0573 changed-token accuracy, what does the model's predicted
  clean state actually look like, and how much does it improve the render over the raw
  corrupted state it was given?
expected_information_gain: >-
  Token accuracy is a poor proxy for whether a vector icon reads correctly, because a
  handful of wrong coordinates can destroy a shape that most-tokens-correct would call
  a success. Rendering the triple decides whether the Gate G scalars are overselling or
  underselling the visual result, and whether the corruption probability is even in a
  regime where the visual task is achievable.
scope_limits: >-
  Twelve held-out icons from the pilot's own 128-icon validation draw, one corruption
  draw each, at the single trained corruption probability of 0.35. Descriptive only. It
  trains nothing, changes no learning artifact, and is not a benchmark.
