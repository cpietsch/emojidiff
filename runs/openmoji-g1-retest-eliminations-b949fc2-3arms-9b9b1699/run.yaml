schema_version: 1
run_id: openmoji-g1-retest-eliminations-b949fc2-3arms-9b9b1699
state: completed
parent_run: openmoji-g1-geometric-gate-v16-85ec724-aaa03592-9b9b1699
retests:
  - openmoji-g1-train-v2-datascale-a50b2e0-c474c94d-9b9b1699
  - openmoji-g1-capacity-v3-3c252d5-ee32665b-9b9b1699
  - openmoji-g1-noise-conditioned-v4-6b935b2-5a9eaf44-9b9b1699
hypothesis: >-
  Four eliminations in this gate - data volume, model capacity, the corruption regime and
  noise-level conditioning - were each declared a plateau on a held-out scalar that was
  roughly 31% four individual fields, on runs stopped at 6 to 24% of their step cap, under
  a corruption process whose replacements a zero-parameter marginal detector identified at
  2.84 lift, with coordinates encoded as unordered categories, and graded on exact-token
  accuracy which v15 and v16 showed points the wrong way. All of that is fixed. None of the
  four conclusions has been retested. At least one of them is expected to change, and
  capacity is the most likely: v3 concluded that 3.53x parameters does nothing, on a setup
  where 768 parameters of slot binding later beat it outright.
expected_information_gain: >-
  Four conclusions currently stand in the record as inadmissible-as-read. This either
  restores them under sound measurement or overturns them, and it is the cheapest
  remaining evidence in the project - the v16 recipe trains in minutes.
scope_limits: >-
  Three arms, not four. The corruption-regime sweep is an evaluation-time study over a
  fixed checkpoint rather than a training factor, so it is a separate piece of work and is
  not bundled here. Fixed-topology and geometry-only, single seed, 12 icons for renders.
arms:
  capacity:
    config: configs/learning/openmoji-g1-retest-capacity.yaml
    sha256: 28e3f1a8a373edba2023101b54b0de560cb4f327a2ca099284d61b00ab2afa9d
    factor: d_model 96->192, heads 4->8, layers 2->4, feedforward 192->384
    parameters: 525152 -> 1936160, 3.69x
    retests: v3, which found 3.53x parameters changed nothing
  data_volume:
    config: configs/learning/openmoji-g1-retest-data-volume.yaml
    sha256: 92c53c85b1a916bbfb39e9113e8f75efe55f3ffc839073d9b8af5e59d327f37f
    factor: train_samples 2681->512, which after the 256 withheld leaves 256 icons trained on
    retests: v2, which found the full split beat a 256-icon subsample
  noise_conditioning:
    config: configs/learning/openmoji-g1-retest-noise-conditioning.yaml
    sha256: ae12f918cacb1d846f6af1c2e7a3fc7a3b14326e2239a68158f3075661915417
    factor: corruption sampled per example over 0.05-0.50 plus 16 noise-level features
    bundling: >-
      Two changes, bundled exactly as v4 bundled them and disclosed the same way.
      Sampling without telling the model leaves it unable to use the level; telling
      without varying leaves it a constant.
    retests: v4, which found noise-level conditioning changed nothing that mattered
