predeclared_criteria:
  note: >-
    Judged on paired per-icon render recovery, the primary metric established by v15 and
    v16. Exact-token accuracy is reported and NOT gated, because v16 is simultaneously
    worse than identity on it and the best geometric denoiser this project has produced.
  evaluated_at: each arm's selected checkpoint, decoded at its own geometric threshold
  primary:
    - id: capacity_retested
      statement: >-
        The capacity arm's mean paired render recovery at 72 px differs from v16's
        +0.2511 by more than the base run's interval half-width of 0.1103, in either
        direction. A difference smaller than that restores v3's conclusion under sound
        measurement; a larger one overturns it.
    - id: data_volume_retested
      statement: >-
        The 256-icon arm's recovery is BELOW v16's +0.2511 by more than 0.1103, which
        would restore v2's conclusion that data volume matters. If it is not, then v2's
        finding does not survive the corrected setup.
    - id: noise_conditioning_retested
      statement: >-
        The noise-conditioning arm's recovery differs from v16's by more than 0.1103 in
        either direction, which would overturn v4's conclusion that it changes nothing.
    - id: structural_safety
      statement: Locked-path exactness holds and every checkpoint round-trips.
    - id: reproducibility
      statement: Every arm returns an identical JSON result on a second invocation.
  reported_not_gated:
    - each arm's held-out aggregate beside identity, and its exact-token changed/retained
    - each arm's derived threshold, selected step, and mean absolute view-unit error
  falsification_meaning: >-
    If all three arms land within the interval of the base, then none of the original
    eliminations was an artifact of the broken measurement and the four conclusions stand
    as originally recorded, which would be a clean restoration rather than a null result.
    If capacity in particular moves, the project has been under-sizing its model since v3
    on the strength of a measurement that was 31% four fields.
