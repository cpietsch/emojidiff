  network: none
predeclared_criteria:
  note: >-
    Declared before launch. No preflight was run; v2's wall time of 75.6 s at 290.1 MiB
    peak CUDA memory for a 3.53x smaller model is ample evidence that this fits the
    bounds.
  evaluated_at: the checkpoint selected by held-out loss
  primary:
    - id: capacity_lowers_held_out_loss
      statement: Held-out loss at the selected step is below v2's 7.3332648277282715.
    - id: changed_recovery_improves
      statement: >-
        Held-out changed-token accuracy is at least 1.25x v2's 0.057304335384175134,
        that is at least 0.071630.
    - id: renders_measurably_closer
      statement: >-
        On the complete 128-icon held-out draw, with identical corruption seeds, the
        mean per-icon RGBA MAE of `x_hat_0` against `x_0` at 72 px is lower than v2's
        selected checkpoint and the 95% confidence interval on that paired difference
        excludes zero. The selection-scalar comparison measured this interval's
        half-width at 0.0032 on the same draw, so an effect above roughly 0.0064 is
        detectable and this is a powered test rather than a hopeful one.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_gate_not_a_prediction:
    - id: retained_preservation
      statement: Held-out retained-token accuracy is at least 0.90.
      note: >-
        Carried from v1 and v2, where it read 0.3256 and 0.4128. Recorded so the bar is
        not quietly dropped; 3.53x parameters is not predicted to close it.
  falsification_meaning: >-
    If capacity does not move these numbers, the model was not the binding constraint
    either, and the corruption schedule becomes the leading candidate: the render probe
    showed x_t at probability 0.35 is already visually destroyed, so the training
    distribution may simply sit in an unachievable regime. That outcome redirects the
    next experiment and must not be tuned away.
  reported_not_gated:
    - the complete held-out trace, the selected step, and whether the cap or early stopping ended it
    - held-out aggregate and retained accuracy at the selected step
    - wall time, peak CUDA memory, and parameter count
