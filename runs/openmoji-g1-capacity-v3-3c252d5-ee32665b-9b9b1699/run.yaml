schema_version: 1
run_id: openmoji-g1-capacity-v3-3c252d5-ee32665b-9b9b1699
state: completed
parent_run: openmoji-g1-train-v2-datascale-a50b2e0-c474c94d-9b9b1699
hypothesis: >-
  The bottleneck v2 exposed is model capacity. At 2,040,976 parameters, 3.53x v2's
  577,552, the same denoiser on the same 2,681-icon split recovers materially more
  corrupted geometry and renders measurably closer to `x_0` than v2's selected
  checkpoint.
expected_information_gain: >-
  v2 showed that 10.5x the data narrows the train/held-out gap 39.7% but lifts
  changed-token recovery only 1.307x, and leaves that gap at 0.0942 - the model is close
  to fitting what it can express. If capacity is the constraint, this is the cheapest
  test that shows it. If it is not, the remaining candidate is the corruption schedule,
  and that is a different experiment.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, single corruption probability of 0.35.
  Not unconditional generation, not topology generation, not an AR comparison. Capacity
  is varied by width and depth together, which is how a transformer's capacity is
  conventionally expressed; head dimension stays at 24 and the feedforward ratio at 2x
  d_model, so no other shape parameter moves.
changed_factors:
  primary: >-
    d_model 96->192, heads 4->8, layers 2->4, feedforward 192->384. 577,552 -> 2,040,976
    parameters, 3.53x.
  held_fixed: >-
    the full 2,681-icon family-disjoint train split, the 128-icon validation draw and
    its corruption seeds, seed 3101, corruption probability 0.35, batch size 16,
    learning rate 0.001, eval_every 60, the 6,300-step cap, the held-out-loss selection
    policy with patience 8, the codec, and the bucket.
  selection_scalar: >-
    Held-out loss, the project's settled rule. Adopted by convention after the 128-icon
    comparison bounded the render-quality difference between loss-selected and
    accuracy-selected checkpoints below 0.0032 RGBA MAE. Declared here so no reading is
    chosen after the fact.
