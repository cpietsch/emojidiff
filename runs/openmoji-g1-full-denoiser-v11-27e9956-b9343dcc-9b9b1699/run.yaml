  reproducibility: {passed: true}
  degenerate_pass_watch: {fired: false, flag_fraction: 0.1915, note: the model over-flags rather than collapsing to keep}
  conclusion: >-
    Changed-token recovery is 2.24x the best any earlier model managed, but identity is
    not beaten and the reason is exact: adding the value head costs 1.064 of detector
    lift, 2.781 down to 1.717, dropping it back below the free continuity statistic. The
    two heads share one encoder and a 289/417-way exact-token objective against a 2-class
    decision is not a fair fight. No flag rate rescues it - every threshold loses to
    identity monotonically - because this degraded detector reaches only about 0.73
    precision at its most confident 1%, where v10 reached 0.9691.
  localises: >-
    Not detection, which v10 solved. Detection and reconstruction cannot currently be
    learned together, and reconstruction itself is weak at 0.1087 exact-token accuracy.
    Two separable next steps: weight the two objectives by field count or give them
    separate encoders, and replace the exact-token value target with a distance kernel
    over the quarter-unit lattice so being close earns gradient.
