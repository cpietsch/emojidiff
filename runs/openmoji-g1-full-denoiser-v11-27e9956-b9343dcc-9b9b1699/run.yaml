schema_version: 1
run_id: openmoji-g1-full-denoiser-v11-27e9956-b9343dcc-9b9b1699
state: completed
parent_run: openmoji-g1-metric-coordinates-v10-abec130-d7044dc2-9b9b1699
hypothesis: >-
  Every trained model in this project scores below the identity policy - emit the
  corrupted input unchanged - on held-out token accuracy, the best by 0.27. Four
  verified defects have since been fixed: the loss averaged over groups so four fields
  carried 31% of it, no attention padding mask so 29.4% of the sequence was attended as
  content, corruption drew uniformly so a token-marginal detector scored 2.84 with no
  context, and coordinates were encoded as unordered categories so no difference was
  computable. With all four fixed, the detector now beats every free reference at 2.781
  against a continuity statistic's 1.893. Running the full objective - the value head
  training alongside the keep head, with the keep decision gating the decode - should
  for the first time clear the identity baseline.
expected_information_gain: >-
  This is the bar the whole Gate G sequence has failed, and the first time it is
  attempted with a working detector and a sound training setup. Clearing it would mean
  the project has a denoiser that does something rather than nothing. Failing it with a
  detector this good would localise the remaining problem to reconstruction - knowing
  WHICH field is wrong but not WHAT belongs there - which is a different and narrower
  question than any asked so far.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, marginal-respecting corruption at
  probability 0.35. Beating identity on token accuracy is not the same as producing a
  recognizable icon; the render probe is run separately and no run in this project has
  produced one yet.
changed_factors:
  primary: training.detection_only true -> false, so the value head trains.
  parameters: unchanged at 525,152
  held_fixed: >-
    v10 exactly otherwise: metric coordinates, marginal corruption, pooled loss, padding
    mask, edit-mask heads, no slot binding, the full 2,681-icon split, the 128-icon
    validation draw and its corruption seeds, seed 3101, probability 0.35, batch 16,
    lr 0.001, eval_every 60, the 6,300-step cap, held-out-loss selection, patience 8.
