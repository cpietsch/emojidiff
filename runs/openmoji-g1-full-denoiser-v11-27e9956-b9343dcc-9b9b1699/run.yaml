baselines:
  identity:
    definition: >-
      Emit x_t unchanged. Legal under argmax decoding, and exactly representable here as
      predict-keep-everywhere. Its aggregate accuracy is retained_total divided by
      (changed_total + retained_total) for this run's own corruption draw, so it is
      computed from the run's reported totals rather than assumed. Under uniform
      corruption at this probability it was 0.6506; under marginal corruption the
      corrupted rate is 0.3482, so it is expected near 0.6518.
    changed_accuracy: 0.0
    retained_accuracy: 1.0
  best_prior_model: {run: v6, aggregate: 0.6119, changed: 0.0132, retained: 0.9335}
  v10_detector_same_setup: {lift: 2.781, note: detection only, no value head}
predeclared_criteria:
  evaluated_at: the checkpoint selected by held-out loss
  primary:
    - id: beats_identity
      statement: >-
        Held-out aggregate token accuracy exceeds the identity policy's, computed as
        retained_total / (changed_total + retained_total) from this run's own totals.
        No model in this project has done this.
    - id: recovers_more_than_identity
      statement: >-
        Held-out changed-token accuracy exceeds v6's 0.0132, the best any edit-mask
        model achieved. Identity scores 0.0 here, so passing beats_identity while
        scoring near zero on changed fields would be collapse, not success.
    - id: preserves_what_identity_preserves
      statement: Held-out retained-token accuracy is at least 0.90.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  standing_gate_not_a_prediction:
    - id: retained_preservation_full
      statement: Held-out retained-token accuracy is at least 0.95.
      note: A stricter form of the original Gate G bar, unmet since v1.
  degenerate_pass_watch: >-
    Predicting keep everywhere scores exactly identity. Report the fraction of held-out
    fields predicted keep; a pass on beats_identity with that fraction approaching 1.0
    is collapse to the trivial policy and must be reported as such.
  falsification_meaning: >-
    If a model that detects corrupted fields at 2.781 lift still cannot beat emitting its
    input unchanged, the remaining problem is reconstruction rather than detection: it
    knows which field is wrong and not what belongs there. That is narrower than anything
    asked so far and points at the value head's 289- or 417-way exact-token softmax over
    a metric lattice, which the task-formulation lens argued should be a distance-kernel
    target instead.
  reported_not_gated:
    - the keep fraction, detector lift, and the full held-out breakdown beside identity
    - the selected step and whether early stopping or the cap ended the run
    - renders, which are run separately and reported whatever the token numbers say
