schema_version: 1
run_id: openmoji-g1-geometric-gate-v16-85ec724-aaa03592-9b9b1699
state: planned
parent_run: openmoji-g1-distance-kernel-v15-6a52c12-744bad0a-9b9b1699
hypothesis: >-
  v15 localises 27% better than v14 in view units and recovers nearly three times as much
  render error, yet gates itself more tightly - 0.8604 against 0.8183 - and edits fewer
  fields. The reason is that the break-even rule p > 1/(1+q) counts a field as recovered
  only when the predicted token is exact, so a model that is closer but not exacter is
  punished for it. Choosing the threshold by absolute view-unit error saved on the
  withheld calibration icons instead should lower it, let v15 act on more of what it
  already localises well, and raise its paired render recovery further.
expected_information_gain: >-
  It is the last step in the chain this session established, and it tests the correction
  v15 forced: that the project's decode rule, like its criteria, was written in
  exact-token terms that point the wrong way. Every quantity it is judged on is
  geometric and was measured before the run.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, marginal-respecting corruption at 0.35.
  The threshold is chosen to maximise error saved on 256 withheld icons, so it is fitted
  - but never on held-out data, and on icons the model did not train on. Twelve icons for
  renders. No run in this project has produced a recognizable icon.
changed_factors:
  primary: >-
    training.geometric_gate false -> true. The decode threshold is swept on the withheld
    calibration icons and set to the value that saves the most absolute view-unit error,
    replacing the exact-token break-even rule.
  parameters: unchanged at 525,152
  weights_unchanged: >-
    This alters decoding and reporting only. Training is identical to v15, so the
    checkpoint should match and any difference is attributable entirely to the gate.
  held_fixed: v15 exactly otherwise.
