baselines:
  note: >-
    Primary metrics are geometric, per the correction v15 forced. Exact-token accuracy is
    reported as secondary and is known to point the wrong way.
  v15: {threshold: 0.8604, paired_render_recovery_72px: 0.1246, paired_render_recovery_18px: 0.1306, mean_abs_view_units: 6.0282, aggregate: 0.6529, identity: 0.6515}
  v14: {threshold: 0.8183, paired_render_recovery_72px: 0.0447, mean_abs_view_units: 8.2871, aggregate: 0.6543}
predeclared_criteria:
  evaluated_at: the checkpoint selected by held-out loss, decoded at the geometric threshold
  primary:
    - id: lowers_the_threshold
      statement: >-
        The geometric threshold is below v15's break-even 0.8604. A rule that credits
        closeness should permit more editing than one that demands exactness.
    - id: improves_paired_render_recovery
      statement: >-
        Mean paired per-icon render recovery at 72 px exceeds v15's +0.1246, with the
        95% interval excluding zero. This is the primary metric.
    - id: saves_error_on_calibration
      statement: >-
        The reported view-unit error saved per field on the calibration icons is
        positive, which is a consistency check on the estimator rather than a result.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  reported_not_gated:
    - held-out aggregate against identity, which may fall since the gate no longer optimises it
    - exact-token changed and retained accuracy, secondary by the v15 correction
    - the break-even threshold alongside, for direct comparison
  expected_tension: >-
    Editing more fields should lower exact-token aggregate accuracy while improving
    geometry, because most edits land near rather than on the true bin. If aggregate
    falls below identity's 0.6515 while render recovery rises, that is the v15 finding
    repeating itself one level down, and it should be reported as such rather than as a
    regression.
  falsification_meaning: >-
    If a geometric gate does not improve render recovery, then the threshold was not what
    limited v15, and the remaining constraint is the value head's absolute accuracy
    rather than how its output is gated. That would point back at the model - a single
    encoder serving both heads, or a categorical parameterisation of a metric quantity
    that might be better regressed - and both are larger changes to predeclare separately.
