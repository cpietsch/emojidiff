    threshold: 0.01
    note: >-
      The interval does not exclude zero and the sign test is a coin flip at both sizes,
      so the scalars are not separable. The bound branch of the criterion is met: any
      true difference is below about 0.0032 RGBA MAE against a median render error near
      0.14, at most 2.3% of the error already present.
  reproducibility: {passed: true}
  decision_applied:
    rule: if_effect_bounded_below_0.01
    outcome: >-
      Held-out loss is the project's checkpoint-selection scalar from now on, chosen as
      the standard early-stopping signal and the rule v1 and v2 already used, not on
      evidence of superiority. The record states that the choice is immaterial for
      render quality at this stage.
  corroborates_predecessor_design_defect: >-
    The twelve-icon medians favoured the loss arm by 6.5%; the 128-icon medians favour
    the accuracy arm by 4.7%, the opposite direction, while the paired difference stays
    near zero in both samples. The median was an unstable statistic on paired data,
    exactly as the predecessor's defect note recorded.
