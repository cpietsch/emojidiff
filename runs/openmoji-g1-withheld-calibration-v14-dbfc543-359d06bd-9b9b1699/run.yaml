  primary:
    - id: beats_identity_without_touching_held_out_data
      statement: >-
        Held-out aggregate token accuracy exceeds the identity policy's, computed from
        this run's own totals. Nothing in this run fits anything on held-out data.
    - id: improves_on_the_trained_on_estimate
      statement: >-
        The margin over identity exceeds v13's 0.0003, despite training on 9.6% fewer
        icons.
    - id: threshold_reflects_an_honest_estimate
      statement: >-
        The derived threshold exceeds v13's 0.7842 and lies below 0.95. A withheld
        estimate should be lower than the trained-on one and therefore a higher, more
        cautious threshold.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  reported_not_gated:
    - the withheld value accuracy against v13's trained-on 0.2751 and the held-out 0.1233
    - changed and retained accuracy, which move in opposite directions by design
  falsification_meaning: >-
    If the withheld estimate does not improve the margin, then the gap between the
    trained-on and held-out value accuracy is not what limits the threshold, and the
    remaining explanation is that the break-even rule itself is too crude - it assumes
    changing a retained field is never right. The fix would then be to estimate the full
    2x2 outcome table on the withheld slice rather than the single scalar q.
