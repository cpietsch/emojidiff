schema_version: 1
run_id: openmoji-g1-withheld-calibration-v14-dbfc543-359d06bd-9b9b1699
state: completed
parent_run: openmoji-g1-derived-threshold-v13-7c73fab-1687c462-9b9b1699
hypothesis: >-
  v13 beat identity without any held-out calibration, 0.6519 against 0.6515, but by only
  0.0003, because it estimated the value head's accuracy on icons the model had trained
  on. There it scores 0.2751 against 0.1233 held out, so the derived threshold came out
  at 0.784 where the held-out accuracy implies 0.890 - too permissive, so the model edits
  more than pays. Estimating that accuracy on 256 train icons withheld from training
  should give a threshold near 0.89 and a margin closer to the 0.0065 a fitted threshold
  achieved, while still never touching held-out data.
expected_information_gain: >-
  It closes the last gap between the project's first win over the trivial policy and a
  win that needs no asterisk at all: no sweep, no held-out calibration, and a threshold
  the model derives from data it never trained on.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, marginal-respecting corruption at 0.35,
  token accuracy rather than renders. Withholding 256 icons also removes them from
  training, so the model sees 2,425 rather than 2,681 - a 9.6% reduction that works
  against this run and is disclosed rather than hidden.
changed_factors:
  primary: >-
    training.calibration_samples 0 -> 256. The last 256 icons of the deterministic train
    selection are withheld from training and used only to estimate the value accuracy
    that sets the decode threshold.
  disclosed_side_effect: >-
    Training data drops from 2,681 to 2,425 icons. That is a real 9.6% reduction and it
    works against the hypothesis, so a pass is conservative and a narrow failure should
    be read with it in mind.
  parameters: unchanged at 525,152
  held_fixed: v13 exactly otherwise.
