  conclusion: >-
    The project beats the trivial policy with nothing fitted on held-out data: the decode
    threshold is derived from 256 icons withheld from training, the checkpoint is
    selected on held-out loss as every run here does, and the identity comparison is a
    plain read. Retained-token accuracy is 0.9815, the highest of any model here. The run
    is handicapped by its own design, training on 2,425 icons rather than 2,681, so the
    margin is conservative.
  honest_limits: >-
    The margin is +0.0027 on token accuracy, about 0.4% relative. This is not a good
    model; it is a model that has stopped being worse than useless. The value head
    reaches only 0.222 on withheld corrupted fields, which is why the break-even
    threshold sits at 0.818 and the model edits just 4% of fields. No render in this
    project has produced a recognizable icon and this run does not change that.
