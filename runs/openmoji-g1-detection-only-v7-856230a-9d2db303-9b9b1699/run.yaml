hypothesis: >-
  The v6 keep head reached only 1.23x precision lift because the value objective
  dominated the shared encoder, not because the detection signal is unlearnable. The
  value term is a 289- or 417-class problem the model demonstrably cannot solve; the
  keep head is a 2-class problem a zero-parameter local-continuity statistic solves at
  2.13x lift. Removing the value term should let the encoder learn representations that
  serve detection, and the trained detector should then at least match the free one.
expected_information_gain: >-
  The registered corpus-scale process comparison assumes a trained model can learn
  detection on some corruption process. That assumption has never been tested. If the
  model cannot match a zero-parameter statistic even with nothing competing for the
  representation, comparing corruption processes is premature and the conclusion is
  about the model class. This costs one training run and blocks a two-arm comparison.
scope_limits: >-
  Fixed-topology and geometry-only, single seed, factorized corruption at p=0.35. A
  detection-only model cannot reconstruct anything, so it is a diagnostic and not a
  candidate design; held-out accuracy is meaningless here because the value head is
  untrained. The gated quantity is detector quality alone.
changed_factors:
  primary: training.detection_only false -> true, dropping the value term from the loss.
  held_fixed: >-
    v6 exactly otherwise: slot binding and edit mask on, the full 2,681-icon split, the
    128-icon validation draw and its corruption seeds, seed 3101, corruption 0.35,
    batch size 16, learning rate 0.001, eval_every 60, the 6,300-step cap, and the
    held-out-loss selection policy with patience 8. Model size is unchanged at 579,872.
