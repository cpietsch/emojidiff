predeclared_criteria:
  note: >-
    Declared before launch. A 60-step CPU preflight was run first to size memory and
    wall time; it reported an untrained held-out changed-token accuracy of 0.003005 and
    0.021892 after 60 steps. That preflight informed these thresholds and is disclosed
    rather than hidden. The full 600-step outcome was not observed beforehand.
  primary:
    - id: held_out_recovery_above_control
      statement: >-
        Held-out changed-token accuracy is at least 10x the untrained same-input
        control evaluated on the identical corruption draw.
    - id: retained_preservation
      statement: Held-out retained-token accuracy is at least 0.90.
    - id: monotone_learning
      statement: >-
        Held-out changed-token accuracy increases in at least 8 of the 10 recorded
        trace intervals.
    - id: structural_safety
      statement: Locked-path exactness holds and the canonical checkpoint round-trips.
    - id: reproducibility
      statement: A second complete invocation returns an identical JSON result.
  reported_not_gated:
    - absolute held-out changed-token accuracy
    - held-out aggregate accuracy and loss
    - the complete 11-point validation trace
  chance_level: >-
    Random legal-token choice is about 0.0035 for endpoints over 289 bins and 0.0024
    for controls over 417 bins, so the untrained control near 0.003 is at chance.
