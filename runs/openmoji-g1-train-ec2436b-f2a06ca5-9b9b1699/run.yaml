hypothesis: >-
  With the selected packed representation, factorized role-uniform geometry corruption,
  and group/subgroup conditioning, a 577,552-parameter denoiser trained on a 256-icon
  family-disjoint subsample of the dominant P32/T128 bucket recovers corrupted geometry
  fields on 128 held-out icons far above its own untrained same-input control, and
  preserves already-correct fields reliably.
expected_information_gain: >-
  This is the first Gate G run whose outcome is a learning claim rather than pipeline
  liveness. It moves the icon count from the 4-icon Gate F fixtures to 256 diverse
  icons across 10 groups and 75 subgroups, and it decides whether a larger
  full-split run is justified.
scope_limits: >-
  Fixed-topology and geometry-only. Not unconditional generation, not topology
  generation, not a style or AR comparison. A single seed, so small differences are not
  interpretable across seeds.
