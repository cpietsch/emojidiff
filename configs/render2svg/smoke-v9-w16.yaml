# Environment smoke test, not a result: v9 cut to 1,200 steps with 16 loader workers, to
# check a new machine end to end (corpus, training, evaluation, CLIP, records) and to
# measure training steps per second against the loader. Its criteria are v9's and
# are not expected to pass.
schema_version: 1
slug: r2s-smoke-v9-w16
parent_run: r2s-full-v9-colour
hypothesis: >-
  Trained on the 2,681 family-disjoint training icons with metric coordinates, path-major
  order, online exact augmentation and compositions, the 9.0M-parameter render-to-program
  model transcribes held-out validation renders better than retrieving the closest
  training icon. Pass requires all three: (1) mean 72 px pixel error below the
  nearest-training-icon baseline with the paired 95% interval on the reduction excluding
  zero; (2) CLIP top-1 on Gate N's 32 validation icons at or above OmniSVG 4B zero-shot,
  0.609; (3) median single-icon latency on the RTX 4080 under 500 ms.
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
model: {image_size: 144, d_model: 256, heads: 8, encoder_layers: 2, decoder_layers: 6, feedforward: 1024, dropout: 0.1, metric: true, fourier: 10, order: path}
training:
  steps: 1200
  batch_size: 32
  learning_rate: 0.0005
  warmup_steps: 100
  eval_every: 400
  eval_icons: 32
  augment_online: true
  augment_original: 0.1
  loader_workers: 16
  compose_probability: 0.5
  compose_parts: 4
  augment_mirror: 0.5
  augment_max_shift: 48
  augment_colour: 0.1
final_eval_icons: 32
clip_icons: 8
