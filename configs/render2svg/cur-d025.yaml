# Curiosity wave 3 (B300, loader of d54e21d: same stream, faster), one change from r2s-cur-dropout02: dropout 0.2 -> 0.25.
# Wave 2: dropout 0.2 replicated over three seeds (0.0690-0.0698 against 0.0719-0.0728 for four
# v9 runs); dropout 0.2 with 8 decoder layers reached 0.0684 on one seed; dropout 0.3 and
# dropout plus weight decay were worse.
schema_version: 1
slug: r2s-cur-d025
parent_run: r2s-cur-dropout02
hypothesis: >-
  With dropout 0.25 the model transcribes validation renders better than v9 (dose between 0.2 and 0.3). Pass requires the paired 95% bootstrap interval on the per-icon reduction in mean
  72 px pixel error on the 339 validation renders to exclude zero against each normal v9 run
  (RTX 4080 original, H100 rerun, B300 seeds 2 and 3) and, for depth arms, a direction
  consistent across seeds against dropout 0.2 at 6 layers.
  Its greedy latency on the RTX 4080 is recorded.
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
model: {image_size: 144, d_model: 256, heads: 8, encoder_layers: 2, decoder_layers: 6, feedforward: 1024, dropout: 0.25, metric: true, fourier: 10, order: path}
training:
  steps: 60000
  batch_size: 32
  learning_rate: 0.0005
  warmup_steps: 1000
  eval_every: 2000
  eval_icons: 64
  augment_online: true
  augment_original: 0.1
  loader_workers: 16
  compose_probability: 0.5
  compose_parts: 4
  augment_mirror: 0.5
  augment_max_shift: 48
  augment_colour: 0.1
final_eval_icons: 339
clip_icons: 32
