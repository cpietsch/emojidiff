# Curiosity wave 1 (B300), one change from r2s-full-v9-colour: the 2,211 Twemoji icons that fit the codec added to training (v8's data on v9; no source token).
# Scored paired against the v9 rerun on the same machine and seed (full-v9-colour.yaml on a B300).
schema_version: 1
slug: r2s-cur-twemoji
parent_run: r2s-full-v9-colour
hypothesis: >-
  With the Twemoji icons that fit the codec added to the training split (held-out concepts excluded), and everything else as in v9, the render-to-program model transcribes
  the 339 validation renders with lower mean 72 px pixel error than v9 trained on the same
  machine and seed. Pass requires the paired 95% bootstrap interval on the per-icon reduction
  against that v9 rerun to exclude zero. Its greedy latency on the RTX 4080 is recorded.
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
model: {image_size: 144, d_model: 256, heads: 8, encoder_layers: 2, decoder_layers: 6, feedforward: 1024, dropout: 0.1, metric: true, fourier: 10, order: path}
training:
  steps: 60000
  batch_size: 32
  learning_rate: 0.0005
  warmup_steps: 1000
  eval_every: 2000
  eval_icons: 64
  augment_online: true
  augment_original: 0.1
  loader_workers: 16
  compose_probability: 0.5
  compose_parts: 4
  augment_mirror: 0.5
  augment_max_shift: 48
  augment_colour: 0.1
  extra_training: [twemoji]
final_eval_icons: 339
clip_icons: 32
