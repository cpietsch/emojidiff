# Gate L arm 22: arm 20 at roughly ten times the parameters, with the same dropout.
#
# Capacity with regularisation is the one cell no gate in this project has measured:
# Gate I's capacity sweep ran without dropout and got monotonically worse, Gate G's
# capacity arm was within noise on a different task. d_model 256, 8 heads, 6 layers,
# feedforward 1024 - about 5.3M parameters against 532k - dropout 0.1 as before, the
# same budget, mechanism, spans and criteria as arm 20.
schema_version: 1
study_version: masked-span-l22-specialist-4-large
source_revision: a83419d
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
report_root: reports/learning/masked-span-l22-specialist-4-large
checkpoint_root: data/processed/masked-span-l22-specialist-4-large

data:
  train_icons: null
  evaluate_on: validation
  task: span
  span_length: 4
  inpaint_seed: 3501
  evaluation_icons: 339
  inpaint_icons: 64

model: {d_model: 256, heads: 8, layers: 6, feedforward: 1024, metric_coordinates: 8, dropout: 0.1, start_features: true, metric_head: true}

# One family, one segment at a time.
masks: {span: 1.0, span_max: 4}

training:
  steps: 6300
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 3601
  eval_every: 300
  patience_evals: 8
  marginal_alpha: 1.0
  coordinate_tau: 1.0

decoding: {iterations: 8, chain_order: true, samples: 1, render_size: 72, render_timeout_seconds: 20}

# Predeclared, and hashed into the run identity with the rest of this file.
criteria:
  # The span task's criteria, as l2's were for the whole path: beat the fill that joins
  # the visible ends and the marginal policy on paired render error with the interval
  # excluding zero, a median recovery of 0.30 of the join's error - a hard bar against a
  # strong identity policy, kept rather than lowered - and every completion valid. The
  # continuity criterion of the studies before it is reported, not gated.
  beats_drop_baseline: true
  beats_marginal_baseline: true
  min_median_recovery: 0.30
  require_all_valid: true
