# Gate L's first evidence, and deliberately the smallest: can the masked model learn
# these programs at all, through its masks and its grammar-ordered decoder?
#
# Gate E asked this of the denoiser and Gate I of the causal model before either ran at
# corpus scale, and both times it was worth the hour. A model that cannot memorise four
# icons has a broken objective, a broken mask family or a broken decoder, and none of
# those is worth discovering at 2,681 icons.
#
# Four icons from four distinct subgroups, as in Gate I: the model is conditioned on
# group and subgroup only, so two icons sharing a subgroup would be the same prompt and
# no model could reproduce both. Evaluation is on the training icons themselves under
# one fixed mask draw per icon, and the inpainting check masks one whole path per icon
# and asks for it back token for token.
#
# No dropout here on purpose. This is a memorisation test; regularisation belongs to the
# corpus run, where it is the one cell no gate has yet measured together with capacity.
schema_version: 1
study_version: masked-overfit-l1
source_revision: 01917d5
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
report_root: reports/learning/masked-overfit-l1
checkpoint_root: data/processed/masked-overfit-l1

data:
  train_icons: 4
  distinct_subgroups: true
  evaluate_on: train
  evaluation_icons: 4
  inpaint_icons: 4

# The shape v16 and the AR arms share: d_model 96, 4 heads, feedforward 192; four
# layers as in ar-corpus-i2. Metric coordinates on from the first run.
model: {d_model: 96, heads: 4, layers: 4, feedforward: 192, metric_coordinates: 8, dropout: 0.0}

# The editing operations, weighted so that whole-path completion - the scored task -
# and the uniform mask that makes generation the same model carry most of the draw.
masks: {random: 0.3, path: 0.3, span: 0.2, style: 0.1, geometry: 0.1, max_paths: 2}

training:
  steps: 3000
  batch_size: 4
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 3401
  eval_every: 100
  # Evaluation is on the training icons, so the held-out trace should keep improving
  # and patience should never fire; if it does, that is a finding.
  patience_evals: 30
  marginal_alpha: 1.0
  # v15's correction: the coordinate target spreads over the lattice by distance, tau in
  # view units, so being close earns gradient.
  coordinate_tau: 1.0

decoding: {iterations: 8, samples: 1, render_size: 72, render_timeout_seconds: 20}

# Predeclared, and hashed into the run identity with the rest of this file.
criteria:
  # Memorisation over the masked positions the grammar leaves free, under the fixed
  # evaluation masks. Four icons into ~530k parameters is far inside capacity.
  min_masked_token_accuracy: 0.99
  # Exact-token held-out likelihood, untrained against selected. Two orders of magnitude
  # is unambiguous; a flat signal is the Gate G failure mode.
  min_loss_reduction_factor: 100.0
  # The strong one: greedy grammar-ordered completion of one masked whole path must
  # reproduce it token for token on every icon. It exercises the mask family, the tier
  # order, the later-path bounds and the confidence schedule against a known target.
  min_exact_path_reproduction_rate: 1.0
  # Every completion - greedy, sampled and marginal - must survive the packed validator
  # and the isolated renderer. Free by construction, which is why it is worth checking.
  require_all_valid: true
