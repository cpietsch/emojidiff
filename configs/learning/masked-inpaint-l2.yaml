# Gate L at corpus scale: the first measurement in this project of an editing operation
# a person would ask for.
#
# Matched to v16 and to ar-corpus-i2 on every term PROJECT_PLAN.md names: the same
# d_model 96, 4 heads, feedforward 192 and four layers as the causal arm, the same
# hashed corpus and family-disjoint splits, 6,300 steps at batch 16 for the same 100,800
# icon presentations. Dropout 0.1 from the first run - the largest single effect Gate I
# measured, and a masked model should start with it rather than discover it last.
#
# The task: one active path removed from each held-out icon, header and segments, its
# length kept. The model draws it back given the rest of the icon and the group and
# subgroup labels. Three policies see exactly the same input.
#
#   drop      - the icon with the path left out; what an editor shows before the fill,
#               and the identity policy of this task.
#   marginal  - the zero-parameter position-marginal policy of Gate I, decoded through
#               the same grammar-ordered tiers; corpus statistics and nothing about
#               this icon.
#   model     - the trained completion, greedy so the paired comparison is
#               deterministic; one sampled completion is rendered beside it for the
#               eye and is not part of any criterion.
#
# Scored by paired per-icon RGBA error at 72 px against the clean render, on 64 held-out
# icons with at least two active paths, with the sheet beside the numbers.
schema_version: 1
study_version: masked-inpaint-l2
source_revision: 01917d5
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
report_root: reports/learning/masked-inpaint-l2
checkpoint_root: data/processed/masked-inpaint-l2

data:
  train_icons: null
  evaluate_on: validation
  # The whole family-disjoint validation split for the likelihood trace and selection;
  # the first 64 of its seeded order for the inpainting measurement.
  evaluation_icons: 339
  inpaint_icons: 64

model: {d_model: 96, heads: 4, layers: 4, feedforward: 192, metric_coordinates: 8, dropout: 0.1}

masks: {random: 0.3, path: 0.3, span: 0.2, style: 0.1, geometry: 0.1, max_paths: 2}

training:
  steps: 6300
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 3501
  eval_every: 300
  patience_evals: 8
  marginal_alpha: 1.0
  coordinate_tau: 1.0

decoding: {iterations: 8, samples: 1, render_size: 72, render_timeout_seconds: 20}

# Predeclared, and hashed into the run identity with the rest of this file.
criteria:
  # Paired per-icon render error, model against the path-dropped icon: the mean
  # difference must be positive with the 95% t-interval excluding zero. An editor that
  # does not beat leaving the hole is not an editor.
  beats_drop_baseline: true
  # The same against the marginal policy. A model that only knows the corpus's colours
  # and ink draws what the marginal policy draws, and this is where that shows.
  beats_marginal_baseline: true
  # The magnitude bar, which Gate I's data-scaling arm taught this project to write:
  # a direction without a magnitude does not identify a result. Median recovery of the
  # render error the missing path costs, 0.30 - a completion that is roughly in the
  # right place, the right colour and the right size. This is a judgement, stated
  # before the run, and the run is falsified if it is not met even if both paired
  # tests pass.
  min_median_recovery: 0.30
  # Every completion - greedy, sampled and marginal - validates and renders. Free by
  # construction, and a failure here is a decoder bug rather than a fact about editing.
  require_all_valid: true
