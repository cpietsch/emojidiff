# Gate L arm 10: arm 5 with start-point features, and nothing else changed.
#
# Four arms - ownership binding, the training mixture, the metric head twice - left the
# model unable to read its neighbours: 55-60 bins from the truth against 26 for a policy
# that copies the previous endpoint, with a 40-bin shift of that endpoint moving the
# prediction by a median of zero. The causal model of Gate I could fit its coordinates
# because the previous coordinate was the input at its prediction position. This arm
# makes the masked model's input as local: every segment block carries Fourier features
# of its own start point when it is visible. Same corpus, splits, budget, single-segment
# masks, kernel, head and criterion as arm 5.
schema_version: 1
study_version: masked-continuity-l10-start
source_revision: 4c9d1e3
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
report_root: reports/learning/masked-continuity-l10-start
checkpoint_root: data/processed/masked-continuity-l10-start

data:
  train_icons: null
  evaluate_on: validation
  evaluation_icons: 339
  inpaint_icons: 16

model: {d_model: 96, heads: 4, layers: 4, feedforward: 192, metric_coordinates: 8, dropout: 0.1, start_features: true}

# One family, one segment at a time.
masks: {span: 1.0, span_max: 1}

training:
  steps: 2100
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  seed: 3601
  eval_every: 300
  patience_evals: 8
  marginal_alpha: 1.0
  coordinate_tau: 1.0

decoding: {iterations: 8, samples: 1, render_size: 72, render_timeout_seconds: 20}

# Predeclared, and hashed into the run identity with the rest of this file.
criteria:
  # The model's mean endpoint error in bins, over one hidden segment per held-out icon,
  # must be below the copy-the-previous-endpoint policy's. That policy scored 24.5 on
  # this draw; the corpus arms scored 55 and 56.
  beats_copy_previous: true
  # Every completion validates and renders.
  require_all_valid: true
