# EXPLORATORY. lfp-v1 exactly, on a parent that FAILED its declared gate: vt-v1 passed
# A3 but failed A1 - its reconstruction (0.083) is non-inferior to v9 (+0.009, margin
# 0.015) but does not beat retrieval once mirrored training icons are candidates
# (+0.002 [-0.002, +0.006]). The declared rule sends the canvas line to a c = 16 rerun,
# which follows this run. This run exists so the operator can judge flow-prior samples
# visually an hour sooner; its B1-B5 outcomes are reported, and any pass is conditional
# on a stage A that failed its gate. Only `slug`, `parent_gate` and this header differ
# from lfp-v1.yaml.
#
# The canvas latent, stage B (latent plan, section 2, arm 3): a rectified-flow prior
# over the frozen vt-v1 latent grid. One factor against vt-v1's own sampling: a learned
# prior in place of N(0, I), over the same VT, decoded the same way (greedy, IEEE
# float32). The VT is frozen; nothing of it trains here.
#
# Latents: 32 per training icon - the icon itself, then 31 exact variants (mirror 0.5,
# translation up to 12 view units, palette permutation 0.1; no compositions, because
# the target is the emoji distribution) - encoded once by the frozen VT (posterior
# means and sigmas, float16) under ~/.cache/mojidiff/latent-flow/; plus the 339
# validation icons, which select the checkpoint. Test icons are never encoded.
# Network: DiT, 2 x 2 patches of the (8, 18, 18) grid = 81 tokens, d 256, 8 blocks,
# 8 heads, MLP ratio 4, adaLN-zero on t, 2-D sin-cos positions: 9,747,744 parameters.
# (The plan's "about 6.5M" left out adaLN's per-block modulation, 8 x 394,752.)
#
# A real run refuses to start on an uncommitted tree, or unless vt-v1's run record is
# completed, names the checkpoint below, and passed A1 and A3 (`parent_gate`).
#   .venv/bin/python -m mojidiff.learning.latent_flow --config configs/latent/lfp-v1.yaml
# After it completes, add the gallery entry (backend canvas-flow) and score it twice:
#   .venv/bin/python -m mojidiff.learning.latent_metrics --registry-id <id> --copy-rule without-twins
#   .venv/bin/python -m mojidiff.learning.latent_metrics --registry-id <id> --copy-rule without-twins \
#       --interpolation backend
# B1-B3 read the first report's samples block; B4 and B5 the second report's interpolation
# block (interpolation.path slerp-through-prior-noise). The first report's interpolation
# block is the frozen VT's lerp of posterior means, the same as vt-v1's under `canvas`.
schema_version: 1
slug: lfp-v1x-exploratory
parent_run: vt-v1-74dfbd2-46380052-47646604
parent_checkpoint: /home/dev/.cache/mojidiff/runs/vt-v1-74dfbd2-46380052-47646604/best.pt
parent_gate: [A3]
hypothesis: >-
  A rectified-flow prior fitted to the aggregate posterior of the frozen canvas latent
  (vt-v1, c = 8) replaces its N(0, I) prior, whose draws decode to fragments, and so
  generates whole, novel OpenMoji-like drawings and interpolates through plausible
  drawings. The prior is a 9.7M-parameter DiT over standardised (8, 18, 18) grids
  (x_t = (1 - t) x_0 + t eps, velocity target, logit-normal t, EMA 0.999), trained on
  posterior draws of 32 exact variants per training icon (no compositions) and selected
  by EMA flow loss on the validation icons' latents. Samples: 50 Euler steps from noise
  scale 1 to z_hat_0, greedy IEEE float32 decoding by the VT. Scored afterwards by
  latent_metrics through the gallery backend canvas-flow on its fixed sets (339 samples,
  seed 23; 32 validation pairs x 9 frames, rng 17; CLIP ViT-B/32 at 72 px against the
  339 validation renders; bootstrap intervals, paired where paired; copy rule
  without-twins): B1-B3 on the report with default settings (its samples block); B4
  and B5 on the report run with --interpolation backend, whose interpolation block is
  canvas-flow's own path, the slerp below (the report records interpolation.path
  slerp-through-prior-noise). The default report's interpolation block is the frozen
  VT's lerp of posterior means and scores neither B4 nor B5. Pass requires B1-B3; B4 and
  B5 are the interpolation claims.
  (B1) fragment rate at most 10%. (B2) CLIP k-NN precision at least 2x the best latent-v2
  prior row (N(0, I) or refit), and recall above it, both with intervals excluding zero.
  (B3) copy rate at most 10% and all 339 samples distinct. (B4) slerp through the
  prior's noise space (reverse-ODE inversion of both posterior means, slerp, forward
  integration): interior fragment rate at most 15%, jump share below latent-v2's
  (paired over pairs, interval excluding zero), detour rate at most 20%. (B5) slerp
  interior precision above v9 on pixel crossfades of the same pairs, paired, interval
  excluding zero; a failure is recorded as "the latent adds nothing over crossfade plus
  transcriber". Decision: B1-B3 pass - the gallery's main latent model. B3 fails - add
  compositions to the prior's data, then an earlier-stopped prior. B1 or B2 fails while
  B3 passes - a larger prior. Only B5 fails - keep the model; its interpolation is a
  dissolve. Reported without a criterion: validation flow loss against the Gaussian
  velocity, vt-v1's N(0, I) samples on the same seeds, lerp strips, watch-it-draw strips,
  ms per sample.
pilot_config: configs/learning/openmoji-g1-geometric-gate-v16.yaml
latents:
  variants: 32
  originals: true
  mirror: 0.5
  max_shift: 48
  colour: 0.1
  seed: 9101
  chunk_icons: 8
  train_icons: null
  validation_icons: 339
  encode_batch: 64
  workers: 16
network: {patch: 2, d_model: 256, layers: 8, heads: 8, mlp_ratio: 4.0, frequency_dim: 256}
training:
  steps: 40000
  batch_size: 256
  learning_rate: 0.0003
  weight_decay: 0.0
  warmup_steps: 1000
  schedule: constant
  grad_clip: 1.0
  ema_decay: 0.999
  time_mean: 0.0
  time_std: 1.0
  posterior_sampling: true
  seed: 7101
  eval_every: 1000
  validation_draws: 16
  trace_every: 100
  bf16: true
sampling: {steps: 50, trajectory_frames: 8}
eval_icons: 339
prior_samples: 64
interpolation_pairs: 8
interpolation_frames: 9
trajectories: 4
latency_repeats: 10
