  # 0.5% corpus tails. They quarantine candidates for review; they never delete data.
  threshold_version: empirical-tail-v1
  low_ink_fraction_72_max: 0.06405477260348584
  thin_bbox_width_72_max: 20
  thin_bbox_height_72_max: 25
  small_bbox_area_72_max: 946
  excessive_paths_min: 34
  excessive_segments_min: 329
