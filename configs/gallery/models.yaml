# The models the gallery serves, in display order (scripts/serve_gallery.py).
#
# Read once at startup: edit this file and restart the gallery. Each entry:
#   id           short, unique; the page and the ratings name the model by it
#   run_id       the run: stats from runs/<run_id>/run.yaml, weights from
#                ~/.cache/mojidiff/runs/<run_id>/best.pt
#   kind         transcriber (render to SVG) or latent
#   label        the name the page shows
#   description  one line: what distinguishes the model
#   backend      latent models only: how the checkpoint loads, encodes, decodes and
#                samples - a name in mojidiff.gallery.latent_backends.BACKENDS
#                (`vae`: LatentToProgram with its N(0, I) prior). A new kind of latent
#                model adds a backend there, then an entry here.
#
# An unknown field or backend, a duplicate id, or a missing checkpoint stops the gallery
# before it binds. Ratings name the model's id and run_id: give a retrained model a new
# id rather than reusing one.


schema_version: 1
models:
- id: v9
  run_id: r2s-full-v9-colour-621bc8e-b26ad95e-47646604
  kind: transcriber
  label: v9 colour
  description: v7 with palette permutation 0.1 - colours fixed; best on validation

- id: v7
