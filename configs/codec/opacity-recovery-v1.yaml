  opacities: [0.25, 0.4, 0.5, 0.502, 0.6, 0.9969, 0.997, 0.999, 1.0]
  stroke_widths: [0.204, 0.25, 1.0, 1.961, 2.0]
  dash_patterns: []
  miter_limits: [4.0, 10.0]
  max_serialized_bytes: 2000000

projection:
  # Truncation is forbidden. The two known one-scalar OOB cases are measured with an
  # explicit clamp after the strict encoding result is recorded separately.
  allow_truncation: false
  allow_clamping: true

render:
